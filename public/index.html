        var total = allItems.length;
        var totalPages = Math.ceil(total / _faqPageSize);
        if (_faqPage > totalPages) _faqPage = totalPages;
        var start = (_faqPage - 1) * _faqPageSize;
        var pageItems = allItems.slice(start, start + _faqPageSize);
        el.innerHTML = pageItems.map((f, i) =>
          '<div class="faq-row" data-id="' + f.id + '">' +
            '<input type="checkbox" class="faq-check" value="' + f.id + '">' +
            '<div class="faq-body">' +
              '<div class="faq-q-text">' + self.esc(f.question) + (f.extracted ? ' <span class="faq-extract-badge">🤖</span>' : '') + '</div>' +
              '<div class="faq-a-text">' + self.esc(f.answer) + '</div>' +
              '<div class="faq-meta">' +
                                (f.source_file ? '<span>📄 <a class="source-link" onclick="App.previewSourceFile(\'' + self.escAttr(f.source_file) + '\')">' + self.esc(f.source_file) + '</a></span>' : '') +
              '</div>' +
            '</div>' +
            '<div class="faq-actions">' +
              '<button class="btn btn-ghost btn-sm edit-faq" data-item=\'' + self.escJS(JSON.stringify(f)) + '\'>编辑</button>' +
              '<button class="btn btn-danger btn-sm del-faq" data-id="' + f.id + '">删除</button>' +
            '</div>' +
          '</div>'
        ).join('');

        // 分页器
        var pg = document.getElementById('admin-faq-pagination');
        var pgHtml = '<span class="page-info">共 ' + total + ' 条</span>';
        var maxVisible = 7;
        var startPage = Math.max(1, _faqPage - Math.floor(maxVisible / 2));
        var endPage = Math.min(totalPages, startPage + maxVisible - 1);
        if (endPage - startPage + 1 < maxVisible) startPage = Math.max(1, endPage - maxVisible + 1);
        if (_faqPage > 1) pgHtml += '<button class="page-btn" data-page="' + (_faqPage - 1) + '">‹</button>';
        if (startPage > 1) pgHtml += '<button class="page-btn" data-page="1">1</button>' + (startPage > 2 ? '<span class="page-dots">…</span>' : '');
        for (var p = startPage; p <= endPage; p++) pgHtml += '<button class="page-btn' + (p === _faqPage ? ' active' : '') + '" data-page="' + p + '">' + p + '</button>';
        if (endPage < totalPages) pgHtml += (endPage < totalPages - 1 ? '<span class="page-dots">…</span>' : '') + '<button class="page-btn" data-page="' + totalPages + '">' + totalPages + '</button>';
        if (_faqPage < totalPages) pgHtml += '<button class="page-btn" data-page="' + (_faqPage + 1) + '">›</button>';
        pg.innerHTML = pgHtml;
        pg.querySelectorAll('.page-btn').forEach(function(btn) { btn.onclick = function() { _faqPage = Number(this.dataset.page); load(); }; });

        el.querySelectorAll('.edit-faq').forEach(btn => {
          btn.onclick = () => {
            var f = JSON.parse(btn.dataset.item);
            var form = document.getElementById('faq-form');
            form.elements.id.value = f.id;
            form.elements.question.value = f.question;
            form.elements.answer.value = f.answer;
            form.elements.source_file.value = f.source_file || '';
            document.getElementById('faq-modal-title').textContent = '编辑 FAQ';
            document.getElementById('faq-modal').style.display = 'flex';
            document.getElementById('faq-modal').classList.add('show');
          };
        });
        el.querySelectorAll('.del-faq').forEach(btn => {
          btn.onclick = async () => {
            if (!await self.confirmAsync('确认删除此 FAQ？')) return;
            var r = await fetch('/api/faq/' + btn.dataset.id, { method: 'DELETE' });
            if (r.ok) { load(); updateCount(); }
          };
        });

        el.querySelectorAll('.faq-check').forEach(cb => {
          cb.onchange = updateCount;
        });

        updateCount();
      } catch { document.getElementById('admin-faq-list').innerHTML = '<div class="empty-state"><div class="empty-icon">' + I.alertTriangle + '</div><div class="empty-text">加载失败</div></div>'; }
    };

    var updateCount = () => {
      var checks = document.querySelectorAll('#admin-faq-list .faq-check:checked');
      var count = checks.length;
      document.getElementById('faq-select-count').textContent = '已选 ' + count + ' 项';
      document.getElementById('faq-batch-del-btn').disabled = count === 0;
      
      
      document.getElementById('faq-select-all').checked = count > 0 && count === document.querySelectorAll('#admin-faq-list .faq-check').length;
    };

    await load();

    // ── 事件绑定 ──
    document.getElementById('faq-select-all').onchange = function() {
      document.querySelectorAll('#admin-faq-list .faq-check').forEach(cb => cb.checked = this.checked);
      updateCount();
    };

    document.getElementById('add-faq-btn').onclick = () => {
      var form = document.getElementById('faq-form');
      form.reset();
      form.elements.id.value = '';
      document.getElementById('faq-modal-title').textContent = '添加 FAQ';
      document.getElementById('faq-modal').style.display = 'flex';
      document.getElementById('faq-modal').classList.add('show');
    };

    document.getElementById('faq-form').onsubmit = async (e) => {
      e.preventDefault();
      var fd = new FormData(e.target);
      var id = fd.get('id');
      var payload = { question: fd.get('question'), answer: fd.get('answer'), category: fd.get('category'), source_file: fd.get('source_file') };
      var method = id ? 'PUT' : 'POST';
      var url = id ? '/api/faq/' + id : '/api/faq';
      var r = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      if (r.ok) { document.getElementById('faq-modal').style.display = 'none'; document.getElementById('faq-modal').classList.remove('show'); load(); }
      else { var d = await r.json(); self.toast(d.error || '保存失败','error'); }
    };

    // ── 批量删除 ──
    document.getElementById('faq-batch-del-btn').onclick = async () => {
      var checks = document.querySelectorAll('#admin-faq-list .faq-check:checked');
      var ids = Array.from(checks).map(c => Number(c.value));
      if (!ids.length) return;
      if (!await self.confirmAsync('确认批量删除 ' + ids.length + ' 条 FAQ？')) return;
      var r = await fetch('/api/faq/batch-delete', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ids }) });
      if (r.ok) { var d = await r.json(); self.toast('已删除 ' + d.deleted + ' 条','success'); load(); }
      else { var d = await r.json(); self.toast(d.error || '删除失败','error'); }
    };
    // ── 导入 ──
    document.getElementById('faq-import-btn').onclick = () => {
      var inp = document.createElement('input');
      inp.type = 'file';
      inp.accept = '.csv,.json';
      inp.onchange = async function() {
        if (!this.files || !this.files[0]) return;
        var fd = new FormData();
        fd.append('file', this.files[0]);
        var r = await fetch('/api/faq/import', { method: 'POST', body: fd });
        if (r.ok) { var d = await r.json(); self.toast('已导入 ' + d.imported + ' 条','success'); load(); }
        else { var d = await r.json(); self.toast(d.error || '导入失败','error'); }
      };
      inp.click();
    };

    // ── 导出 ──
    document.getElementById('faq-export-btn').onclick = () => {
      var overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.classList.add('show');
      overlay.innerHTML = '<div class="modal" style="max-width:280px"><div class="modal-title">导出 FAQ</div>' +
        '<div class="form-group mb-2"><label>格式</label><select id="export-format" class="input"><option value="json">JSON</option><option value="csv">CSV</option></select></div>' +
        '<div class="modal-actions">' +
          '<button class="btn btn-ghost btn-sm" id="export-cancel">取消</button>' +
          '<button class="btn btn-primary btn-sm" id="export-confirm">导出</button>' +
        '</div></div>';
      document.body.appendChild(overlay);
      overlay.addEventListener('click', function(e) { if (e.target === overlay) overlay.remove(); });
      document.getElementById('export-cancel').onclick = function() { overlay.remove(); };
      document.getElementById('export-confirm').onclick = function() {
        var fmt = document.getElementById('export-format').value;
        window.open('/api/faq/export?format=' + fmt);
        overlay.remove();
      };
    };

    // ── AI 抽取 ──
    document.getElementById('faq-extract-btn').onclick = () => {
      document.getElementById('faq-extract-modal').style.display = 'flex';
      loadExtractFiles();
    };

    var loadExtractFiles = async () => {
      try {
        var r = await fetch('/api/files');
        var files = await r.json();
        // 只显示 .md 文件，且分类为 标准规范/密评FAQ 的
        var mdFiles = files.filter(f => f.name && f.name.endsWith('.md') && (f.category === '标准规范' || f.category === '密评FAQ' || !f.category));
        var list = document.getElementById('extract-file-list');
        if (!mdFiles.length) { list.innerHTML = '<div style="color:var(--text-secondary);padding:12px;text-align:center">暂无可用 .md 文件</div>'; return; }
        list.innerHTML = mdFiles.map(function(f) {
          var catLabel = f.category ? '[' + self.esc(f.category) + '] ' : '';
          return '<label style="display:flex;align-items:center;gap:6px;padding:3px 4px">' +
            '<input type="checkbox" class="extract-file-cb" value="' + self.escAttr(f.path || f.name) + '" checked>' +
            '<span style="font-size:12px">' + self.esc(catLabel + f.name) + '</span></label>';
        }).join('');
      } catch { document.getElementById('extract-file-list').innerHTML = '<div style="color:var(--text-danger);padding:12px">加载失败</div>'; }
    };

    document.getElementById('extract-start-btn').onclick = async () => {
      var fileEls = document.querySelectorAll('.extract-file-cb:checked');
      var filePaths = Array.from(fileEls).map(cb => cb.value);
      var apiKey = document.getElementById('extract-api-key').value.trim();
      var maxPairs = Number(document.getElementById('extract-max-pairs').value) || 50;

      if (!filePaths.length) { self.toast('请选择至少一个文件','warning'); return; }
      if (!apiKey) { self.toast('请输入 API Key','warning'); return; }

      var btn = document.getElementById('extract-start-btn');
      btn.disabled = true;
      btn.textContent = '抽取中...';
      document.getElementById('extract-progress').textContent = '正在分析 ' + filePaths.length + ' 个文件...';
      document.getElementById('extract-result-area').style.display = 'none';

      try {
        var r = await fetch('/api/faq/extract', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ filePaths, apiKey, maxPairs })
        });
        var d = await r.json();
        if (d.success && d.faqs) {
          showExtractResults(d.faqs, filePaths);
          self.toast('抽取完成：共 ' + d.faqs.length + ' 条','success');
        } else {
          self.toast(d.error || '抽取失败','error');
          document.getElementById('extract-progress').textContent = '❌ ' + (d.error || '失败');
        }
      } catch (err) {
        self.toast('网络错误','error');
        document.getElementById('extract-progress').textContent = '❌ 请求失败';
      } finally {
        btn.disabled = false;
        btn.textContent = '开始抽取';
      }
    };

    var showExtractResults = (faqs, filePaths) => {
      var body = document.getElementById('extract-result-body');
      body.innerHTML = faqs.map(function(f, i) {
        return '<tr class="selected">' +
          '<td><input type="checkbox" class="extract-result-cb" value="' + i + '" checked></td>' +
          '<td>' + self.esc(f.question) + '</td>' +
          '<td>' + self.esc(f.answer && f.answer.slice(0, 100)) + (f.answer && f.answer.length > 100 ? '...' : '') + '</td>' +
          '<td>' + self.esc(f.category || '') + '</td>' +
          '<td style="font-size:11px">' + self.esc(f.source_file || '') + '</td>' +
        '</tr>';
      }).join('');
      document.getElementById('extract-result-area').style.display = 'block';
      document.getElementById('extract-progress').textContent = '抽取完成，共 ' + faqs.length + ' 条。勾选需要导入的条目后点击确认。';

      // 全选
      document.getElementById('extract-select-all-result').checked = true;
      document.getElementById('extract-select-all-result').onchange = function() {
        document.querySelectorAll('.extract-result-cb').forEach(cb => cb.checked = this.checked);
        updateExtractImportBtn();
      };
      document.querySelectorAll('.extract-result-cb').forEach(cb => cb.onchange = updateExtractImportBtn);
      updateExtractImportBtn();
    };

    var updateExtractImportBtn = () => {
      var cnt = document.querySelectorAll('.extract-result-cb:checked').length;
      var btn = document.getElementById('extract-import-btn');
      btn.disabled = cnt === 0;
      btn.textContent = '确认导入所选（' + cnt + ' 条）';
    };

    document.getElementById('extract-import-btn').onclick = async () => {
      var checkedCbs = document.querySelectorAll('.extract-result-cb:checked');
      if (!checkedCbs.length) return;

      // 获取选中的 FAQ 数据
      var resultRows = document.querySelectorAll('#extract-result-body tr');
      var selected = [];
      checkedCbs.forEach(function(cb) {
        var idx = Number(cb.value);
        // Reconstruct from the table content
        var row = resultRows[idx];
        if (row) {
          var cells = row.querySelectorAll('td');
          selected.push({
            question: cells[1].textContent.trim(),
            answer: cells[2].textContent.trim(),
            category: cells[3].textContent.trim()
          });
        }
      });

      if (!selected.length) { self.toast('没有选中的条目','warning'); return; }

      // 逐个导入
      var imported = 0;
      for (var faq of selected) {
        try {
          var r = await fetch('/api/faq', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(faq)
          });
          if (r.ok) imported++;
        } catch {}
      }
      self.toast('成功导入 ' + imported + ' / ' + selected.length + ' 条','success');
      document.getElementById('faq-extract-modal').style.display = 'none';
      load();
    };

    if (!this.previewSourceFile) {
      this.previewSourceFile = async (fileName) => {
        var item = { name: fileName };
        App.showFileDetail(item);
      };
    }
  },

  // ─── Toast System ───
  toast(message, type) {
    const t = document.createElement('div');
    t.style.cssText = 'position:fixed;bottom:24px;right:24px;z-index:9999;padding:10px 18px;border-radius:var(--radius-md);font-size:13px;font-weight:500;box-shadow:var(--shadow-lg);animation:fadeIn .25s ease;max-width:360px;word-break:break-word;cursor:pointer';
    const colors = {success:'#065f46', error:'#991b1b', warning:'#92400e', info:'#1e40af'};
    t.style.background = colors[type] || colors.info;
    t.style.color = '#fff';
    t.textContent = message;
    t.onclick = () => t.remove();
    document.body.appendChild(t);
    setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity .3s'; setTimeout(() => t.remove(), 300); }, 3000);
  },
  hugeToast(msg) {
    const ov = document.createElement('div');
    ov.className = 'modal-overlay show';
    var s = ov.style;
    s.position='fixed'; s.inset='0'; s.background='rgba(0,0,0,.5)'; s.zIndex='1000'; s.display='flex'; s.alignItems='center'; s.justifyContent='center'; s.opacity='1';
    ov.onclick = function(e) { if(e.target===ov) ov.remove(); };
    var box = document.createElement('div');
    var bs = box.style;
    bs.background='#fff'; bs.borderRadius='var(--radius-lg)'; bs.padding='60px 80px'; bs.textAlign='center'; bs.animation='scaleIn .2s ease';
    var icon = document.createElement('div');
    icon.textContent = '✔';
    var is = icon.style;
    is.fontSize='48px'; is.color='#065f46'; is.marginBottom='10px';
    box.appendChild(icon);
    var h2 = document.createElement('h2');
    h2.textContent = msg;
    var hs = h2.style;
    hs.margin='15px 0 8px'; hs.fontSize='24px'; hs.color='#065f46'; hs.fontWeight='600';
    box.appendChild(h2);
    var p = document.createElement('p');
    p.textContent = '请使用新密码登录';
    var ps = p.style;
    ps.color='#666'; ps.marginBottom='30px'; ps.fontSize='14px';
    box.appendChild(p);
    var btn = document.createElement('button');
    btn.className = 'btn btn-primary';
    btn.textContent = '确定';
    btn.style.minWidth='120px';
    btn.onclick = function() { ov.remove(); };
    box.appendChild(btn);
    ov.appendChild(box);
    document.body.appendChild(ov);
  },  confirmAsync(msg) {
    return new Promise(resolve => {
      const ov = document.createElement('div');
      ov.className = 'modal-overlay'; ov.style.display = 'flex'; ov.classList.add('show');
      ov.innerHTML = '<div class="modal" style="max-width:380px"><div class="modal-title">' + this.esc(msg) + '</div><div class="modal-actions"><button class="btn btn-ghost btn-sm" id="confirm-no">取消</button><button class="btn btn-danger btn-sm" id="confirm-yes">确认</button></div></div>';
      document.body.appendChild(ov);
      const yesBtn = document.getElementById('confirm-yes');
      const noBtn = document.getElementById('confirm-no');
      yesBtn.onclick = () => { ov.remove(); resolve(true); };
      noBtn.onclick = () => { ov.remove(); resolve(false); };
      ov.addEventListener('click', (e) => { if (e.target === ov) { ov.remove(); resolve(false); } });
      // 防止回车冒泡触发背后按钮
      ov.addEventListener('keydown', (e) => { if (e.key === 'Enter') e.stopPropagation(); });
      noBtn.focus();
    });
  },
  // ─── Utilities ───
  esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; const r = d.innerHTML; return r; },
  escAttr(s) { if (!s) return ''; return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); },
  escJS(s) { if (!s) return ''; return s.replace(/'/g, '\\x27').replace(/"/g, '&quot;'); },
  // ─── Change Password Modal ───
  showChangePasswordModal() {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.classList.add('show');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:center;justify-content:center;opacity:1';
    overlay.innerHTML =
      '<div class="modal" style="background:var(--bg-card);border-radius:var(--radius-lg);padding:24px;width:380px;max-width:90vw;box-shadow:var(--shadow-lg)">' +
        '<h3 style="font-size:16px;font-weight:600;margin-bottom:20px;color:var(--text-primary)">🔑 修改密码</h3>' +
        '<div class="form-group" style="margin-bottom:12px"><label style="display:block;font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:4px">原密码</label><input type="password" id="pw-old" class="input" style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px" placeholder="输入原密码"></div>' +
        '<div class="form-group" style="margin-bottom:12px"><label style="display:block;font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:4px">新密码</label><input type="password" id="pw-new" class="input" style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px" placeholder="至少 6 位"></div>' +
        '<div class="form-group" style="margin-bottom:20px"><label style="display:block;font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:4px">确认新密码</label><input type="password" id="pw-confirm" class="input" style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px" placeholder="再次输入新密码"></div>' +
        '<div id="pw-error" style="color:#EF4444;font-size:12px;margin-bottom:12px;display:none"></div>' +
        '<div style="display:flex;gap:8px;justify-content:flex-end">' +
          '<button class="btn btn-ghost btn-sm" id="pw-cancel-btn">取消</button>' +
          '<button class="btn btn-primary btn-sm" id="pw-submit-btn">确认修改</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(overlay);
    document.getElementById('pw-cancel-btn').onclick = () => overlay.remove();
    overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
    document.getElementById('pw-submit-btn').onclick = async () => {
      const oldPw = document.getElementById('pw-old').value;
      const newPw = document.getElementById('pw-new').value;
      const confirmPw = document.getElementById('pw-confirm').value;
      const errEl = document.getElementById('pw-error');
      if (!oldPw || !newPw || !confirmPw) { errEl.textContent = '请填写所有字段'; errEl.style.display = 'block'; return; }
      if (newPw !== confirmPw) { errEl.textContent = '两次输入的新密码不一致'; errEl.style.display = 'block'; return; }
      if (newPw.length < 6) { errEl.textContent = '新密码至少 6 位'; errEl.style.display = 'block'; return; }
      try {
        const r = await fetch('/api/auth/change-password', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ oldPassword: oldPw, newPassword: newPw }) });
        const d = await r.json();
        if (d.success) { overlay.remove(); App.hugeToast('密码修改成功'); return; }
        else { errEl.textContent = d.error || '修改失败'; errEl.style.display = 'block'; }
      } catch { errEl.textContent = '网络错误'; errEl.style.display = 'block'; }
    };
  },
  fmtSize(b) { if (!b) return ''; if (b < 1024) return b + ' B'; if (b < 1048576) return (b/1024).toFixed(1) + ' KB'; return (b/1048576).toFixed(1) + ' MB'; }
};

App.init();
</script>
<script defer src="/lib/echarts.min.js" onload="if(window.App&&window.App.renderCharts)setTimeout(()=>App.renderCharts(),100)"></script>
</body>
</html>
