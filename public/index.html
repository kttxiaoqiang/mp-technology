  // ─── Sidebar Collapse ───

  _rethemeECharts() {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    ['chart-cat-bar', 'chart-trend-line', 'chart-type-donut', 'chart-search-bar'].forEach(id => {
      const inst = echarts.getInstanceByDom(document.getElementById(id));
      if (inst) inst.dispose();
    });
    this.renderCharts();
  },

  // ─── Charts ───
  _cssVar(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  },
  async renderCharts() {
    if (typeof echarts === 'undefined' || !document.getElementById('chart-cat-bar')) return;
    let data;
    try {
      const r = await fetch('/api/stats');
      data = await r.json();
    } catch { return; }
    if (!data) return;
    const tooltipBg = this._cssVar('--echarts-tooltip-bg');
    const tooltipBorder = this._cssVar('--echarts-tooltip-border');
    const tooltipText = this._cssVar('--echarts-tooltip-text');
    const axisLabel = this._cssVar('--echarts-axis-label');
    const axisLine = this._cssVar('--echarts-axis-line');
    const splitLine = this._cssVar('--echarts-split-line');
    const donutCenter = this._cssVar('--echarts-donut-center');
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';

    // 配色升级 — 更大气的渐变色板
    const gradients = [
      ['#0ef','#0088cc'],
      ['#0ef','#0088cc'],
      ['#0ef','#0088cc'],
      ['#0ef','#0088cc'],
      ['#0ef','#0088cc'],
      ['#0ef','#0088cc'],
      ['#0ef','#0088cc'],
      ['#0ef','#0088cc'],
      ['#0ef','#0088cc']
    ];
    function grad(dir, a, b) {
      return { type: 'linear', x: 0, y: 0, x2: dir==='x'?1:0, y2: dir==='x'?0:1,
        colorStops: [{ offset: 0, color: a }, { offset: 1, color: b }] };
    }

    // 1) 各分类文档数量 — 柱状图
    const catBar = echarts.init(document.getElementById('chart-cat-bar'));
    document.getElementById('chart-cat-bar').style.height = '200px';
        const catOrder = ['方案','报告','密评FAQ','标准规范','法规政策','参考文档','其他','全部'];
    const catNames = Object.keys(data.categories)
      .filter(n => !n.endsWith('/_images') && n !== '_images')
      .sort((a,b) => {
      const ia = catOrder.indexOf(a), ib = catOrder.indexOf(b);
      return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
    });
    const catVals = catNames.map(n => data.categories[n]);
    catBar.setOption({
      tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' }, backgroundColor: tooltipBg, borderColor: tooltipBorder, textStyle: { color: tooltipText } },
      grid: { left: 40, right: 16, top: 20, bottom: 24 },
      xAxis: { type: 'category', data: catNames, axisLabel: { color: axisLabel, fontSize: 12, fontWeight: 500, rotate: 20 }, axisLine: { lineStyle: { color: axisLine } }, axisTick: { show: false } },
      yAxis: { type: 'value', splitLine: { lineStyle: { color: splitLine, type: 'dashed' } }, axisLabel: { color: axisLabel, fontSize: 11, fontWeight: 500 } },
      series: [{
        type: 'bar',
        animationDelay: (i) => i * 80,
        // 每根柱子独立渐变色
        data: catVals.map((v,i) => ({
          value: v,
          itemStyle: { color: grad('y', gradients[i%gradients.length][0], gradients[i%gradients.length][1]), borderRadius: [6,6,0,0] }
        }))
      }],
      animationDelayUpdate: (i) => i * 80,
    });
    setTimeout(() => catBar.resize(), 50);

    // 2) 本月新增趋势 — 折线面积图
    const trendLine = echarts.init(document.getElementById('chart-trend-line'));
    document.getElementById('chart-trend-line').style.height = '200px';
    const trendMonths = data.monthlyTrend.map(t => t.month);
    const trendCounts = data.monthlyTrend.map(t => t.count);
    trendLine.setOption({
      tooltip: { trigger: 'axis', backgroundColor: tooltipBg, borderColor: tooltipBorder, textStyle: { color: tooltipText } },
      grid: { left: 40, right: 16, top: 20, bottom: 24 },
      xAxis: { type: 'category', data: trendMonths, axisLabel: { color: axisLabel, fontSize: 11, fontWeight: 500 }, axisLine: { lineStyle: { color: axisLine } }, axisTick: { show: false } },
      yAxis: { type: 'value', splitLine: { lineStyle: { color: splitLine, type: 'dashed' } }, axisLabel: { color: axisLabel, fontSize: 11, fontWeight: 500 } },
      series: [{
        type: 'line', data: trendCounts, smooth: true, symbol: 'circle', symbolSize: 8,
        lineStyle: { color: '#0ef', width: 2.5 },
        itemStyle: { color: '#0ef', borderColor: 'rgba(0,238,255,0.2)', borderWidth: 1 },
        areaStyle: { color: { type: 'linear', x: 0, y: 0, x2: 0, y2: 1, colorStops: [{ offset: 0, color: isDark ? 'rgba(0,238,255,.4)' : 'rgba(0,238,255,.2)' }, { offset: 1, color: isDark ? 'rgba(0,238,255,.06)' : 'rgba(0,238,255,.02)' }] } },
        animationDelay: 200
      }]
    });
    setTimeout(() => trendLine.resize(), 50);

    // 3) 文档类型占比 — 环形图
    const typeDonut = echarts.init(document.getElementById('chart-type-donut'));
    document.getElementById('chart-type-donut').style.height = '200px';
        const extPairs = Object.entries(data.extensions).sort((a,b) => b[1] - a[1]);
    const extNames = extPairs.map(p => p[0]);
    const extVals = extPairs.map(p => p[1]);
    const totalExt = extVals.reduce((a,b) => a+b, 0);
    typeDonut.setOption({
      tooltip: { trigger: 'item', formatter: '{b}: {c} ({d}%)', backgroundColor: tooltipBg, borderColor: tooltipBorder, textStyle: { color: tooltipText } },
      series: [{
        type: 'pie', radius: ['50%', '72%'], center: ['50%', '50%'], avoidLabelOverlap: true,
        label: { color: axisLabel, fontSize: 12, fontWeight: 500, formatter: '{b}' },
        labelLine: { lineStyle: { color: axisLine } },
        data: extNames.map((n,i) => ({ value: extVals[i], name: n, itemStyle: { color: grad('x', gradients[i%gradients.length][0], gradients[i%gradients.length][1]) } })),
        animationDelay: 400,
        emphasis: { scale: true, label: { fontWeight: 700, fontSize: 13 }, itemStyle: { shadowBlur: 15, shadowColor: 'rgba(0,238,255,.4)', borderColor: 'rgba(0,238,255,0.2)', borderWidth: 1.5 } }
      }],
      graphic: [{
        type: 'text', left: 'center', top: 'center', style: { text: totalExt + '', fill: donutCenter, fontSize: 20, fontFamily: 'JetBrains Mono', fontWeight: 700 },
        z: 100
      }]
    });
    setTimeout(() => typeDonut.resize(), 50);

    // 4) 热门搜索词 — 横向柱状图（最多6条）
    const searchBar = echarts.init(document.getElementById('chart-search-bar'));
    document.getElementById('chart-search-bar').style.height = '200px';
    let searches;
    try {
      const hotRes = await fetch('/api/hot-searches');
      const hotData = await hotRes.json();
      searches = (hotData.hot || []).slice(0, 6);
      if (searches.length === 0) searches = [{ keyword: '暂无搜索数据', count: 1 }];
    } catch { searches = [{ keyword: '暂无搜索数据', count: 1 }]; }
    const searchNames = searches.map(s => s.keyword).reverse();
    const searchVals = searches.map(s => s.count).reverse();
    searchBar.setOption({
      tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' }, backgroundColor: tooltipBg, borderColor: tooltipBorder, textStyle: { color: tooltipText } },
      grid: { left: 80, right: 20, top: 10, bottom: 10 },
      xAxis: { type: 'value', splitLine: { lineStyle: { color: splitLine, type: 'dashed' } }, axisLabel: { color: axisLabel, fontSize: 11, fontWeight: 500 } },
      yAxis: { type: 'category', data: searchNames, axisLabel: { color: axisLabel, fontSize: 12, fontWeight: 500 }, axisLine: { lineStyle: { color: axisLine } }, axisTick: { show: false } },
      series: [{
        type: 'bar',
        data: searchVals.map((v,i) => ({
          value: v,
          itemStyle: { color: grad('x', gradients[i%gradients.length][0], gradients[i%gradients.length][1]), borderRadius: [0,6,6,0] }
        })),
        animationDelay: (i) => i * 100 + 600
      }]
    });
    setTimeout(() => searchBar.resize(), 50);

    // 响应式 resize
    const handleResize = () => {
      catBar.resize(); trendLine.resize(); typeDonut.resize(); searchBar.resize();
    };
    window.addEventListener('resize', handleResize);
  },

  // ─── Open Category ───
  async openCategory(category) {
    this._activeCategoryView = category;
    const ca = document.getElementById('content-area');
    const icon = this._catIcons[category] || I.folder;
    const allCats = ['方案','报告','密评FAQ','标准规范','法规政策','参考文档','其他','全部'];
    const isAdmin = this.user.role === 'admin';
    const tabsHtml = allCats.map(c => '<button class="tab' + (c === category ? ' active' : '') + '" data-cat="' + c + '">' + c + '</button>').join('');
    ca.innerHTML =
      '<div class="breadcrumb-bar">' +
        '<button class="btn btn-ghost btn-sm" id="back-btn" style="padding-left:0;font-size:11px;color:var(--text-tertiary)">' + I.arrowLeft + ' 分类总览</button>' +
        '<span class="crumb-sep">' + '›' + '</span>' +
        '<span class="crumb-current" style="font-size:13px;font-weight:500;color:var(--text-primary)">' + category + '</span>' +
      '</div>' +
      '<div class="flex justify-between items-center mb-3">' +
        '<div class="tabs">' + tabsHtml + '</div>' +
        '<div class="flex items-center gap-2">' +
          (isAdmin ? '<button class="btn btn-ghost btn-sm" id="batch-edit-toggle" style="font-size:11px">✏️ 批量编辑</button>' : '') +
          (isAdmin ? '<label class="batch-inline" style="font-size:12px;display:none;align-items:center;gap:4px;cursor:pointer;white-space:nowrap" id="batch-select-label"><input type="checkbox" id="file-select-all" style="margin:0"> 全选</label>' : '') +
          (isAdmin ? '<span class="select-count" id="file-select-count" style="font-size:11px;display:none;color:var(--text-tertiary)">0</span>' : '') +
          (isAdmin ? '<button class="btn btn-danger btn-sm" id="file-batch-del-btn" disabled style="font-size:11px">批量删除</button>' : '') +
          (isAdmin ? '<select class="input input-sm" id="file-batch-cat-select" disabled style="font-size:11px;max-width:110px;"><option value="">移动...</option><option value="方案">方案</option><option value="报告">报告</option><option value="密评FAQ">密评FAQ</option><option value="标准规范">标准规范</option><option value="法规政策">法规政策</option><option value="参考文档">参考文档</option><option value="其他">其他</option></select>' : '') +
          (isAdmin ? '<button class="btn btn-ghost btn-sm" id="file-batch-cat-btn" disabled style="font-size:11px">应用</button>' : '') +
          '<div class="view-toggle">' +
            '<button class="view-mode' + (this._viewMode === 'card' ? ' active' : '') + '" data-mode="card">⊞</button>' +
            '<button class="view-mode' + (this._viewMode === 'list' ? ' active' : '') + '" data-mode="list">☰</button>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div id="file-list"></div>';

    document.getElementById('back-btn').onclick = () => { this._activeCategoryView = null; this.renderCategoryCards(); };
    document.querySelectorAll('.tabs .tab').forEach(b => { b.onclick = () => this.openCategory(b.dataset.cat); });
    document.querySelectorAll('.view-mode').forEach(b => {
      b.onclick = () => {
        this._viewMode = b.dataset.mode;
        document.querySelectorAll('.view-mode').forEach(x => x.classList.toggle('active', x.dataset.mode === this._viewMode));
        // 退出编辑模式
        document.querySelectorAll('.file-check-wrap').forEach(function(w) { w.classList.remove('show'); });
        var t = document.getElementById('batch-edit-toggle');
        if (t) t.textContent = '✏️ 批量编辑';
        document.getElementById('batch-select-label').style.display = 'none';
        document.getElementById('file-select-count').style.display = 'none';
        if (this._allFiles) this.renderFilePage();
      };
    });

    const catParam = category === '全部' ? '' : category;
    try {
      const r = await fetch('/api/files' + (catParam ? '?category=' + encodeURIComponent(catParam) : ''));
      const d = await r.json();
      this.renderFileList(d.files || d);
    } catch { document.getElementById('file-list').innerHTML = '<div class="empty-state"><div class="empty-icon">' + I.alertTriangle + '</div><div class="empty-text">加载失败</div></div>'; }
  },

  // ─── Render File List ───
  renderFileList(files) {
    const el = document.getElementById('file-list');
    if (!files.length) { el.innerHTML = '<div class="empty-state"><div class="empty-icon">' + I.inbox + '</div><div class="empty-text">暂无文档</div></div>'; return; }
    document.getElementById('search-stats').textContent = '共 ' + files.length + ' 个文件';
    this._allFiles = files; this._page = 1;
    this.renderFilePage();
    setTimeout(() => this.animateStaggered(document.getElementById('file-list'), '.file-card,.file-row', 50), 100);
  },

  renderFilePage() {
    const el = document.getElementById('file-list');
    if (!el) return;
    const files = this._allFiles || [];
    const ps = this._pageSize || 20;
    const pg = this._page || 1;
    const total = files.length, tp = Math.ceil(total / ps), start = (pg - 1) * ps;
    const pfiles = files.slice(start, start + ps);
    const isCard = this._viewMode === 'card';
    const isAdmin = this.user.role === 'admin';

    el.className = isCard ? 'category-grid' : '';

    let html = '';
    for (const f of pfiles) {
      const ext = f.original_ext || (f.original_name || '').split('.').pop().toUpperCase();
      const icons = { PDF:I.file, DOCX:I.fileText, DOC:I.fileText, XLSX:I.fileSpreadsheet, XLS:I.fileSpreadsheet, PPTX:I.film, PPT:I.film, MD:I.fileText, TXT:I.file, PNG:I.image, JPG:I.image, JPEG:I.image };
      const icon = icons[ext] || I.paperclip;
      const imgExts = ['PNG','JPG','JPEG','GIF','WEBP','SVG'];
      const isImg = imgExts.includes(ext);
      const sz = f.file_size ? this.fmtSize(f.file_size) : '';
      const date = f.created_at ? f.created_at.slice(0, 10) : '';

      const selAttr = f.relativePath ? ' data-rpath="' + this.esc(f.relativePath) + '"' : '';
      const checkHtml = isAdmin ? '<input type="checkbox" class="file-check" data-rpath="' + (f.relativePath ? this.esc(f.relativePath) : '') + '">' : '';

      if (isCard) {
        html +=
          '<div class="file-card">' +
            (isAdmin ? '<div class="file-check-wrap">' + checkHtml + '</div>' : '') +
            '<div class="file-icon">' + icon + '</div>' +
            '<div class="file-name" title="' + this.esc(f.original_name) + '">' + this.esc(f.original_name) + '</div>' +
            '<div class="file-meta"><span class="badge">' + (f.category || '') + '</span><span>' + date + '</span>' + (sz ? '<span>' + sz + '</span>' : '') + (f.image_count > 0 ? '<span>📷 ' + f.image_count + '</span>' : '') + '</div>' +
            '<div class="file-actions">' +
              (f.downloadPath ? (f.isHtml ? '<a href="/api/view-html?path=' + encodeURIComponent(f.original_name) + '" class="btn btn-ghost btn-sm" target="_blank">' + I.file + ' 查看</a>' : '<a href="' + f.downloadPath + '" class="btn btn-ghost btn-sm" download>' + I.download + ' 下载</a>') : '') +
              (isImg ? '<button class="btn btn-ghost btn-sm" data-img="' + (f.downloadPath || '') + '" data-name="' + this.escJS(f.original_name.replace(/\.[^.]+$/, '')) + '" onclick="App.imgPreview(this.dataset.img,this.dataset.name)">' + I.image + ' 预览</button>' : '') +
              (f.original_name && f.original_name.toLowerCase().endsWith('.md') && !isImg ? '<button class="btn btn-ghost btn-sm preview-btn" data-path="' + encodeURIComponent(f.path) + '" data-title="' + this.escJS(f.original_name) + '" onclick="App.preview(this.dataset.path,this.dataset.title)">' + I.file + ' 预览文档</button>' : '') +
              (isAdmin ? '<button class="btn btn-danger btn-sm del-file" data-path="' + this.esc(f.path) + '" data-name="' + this.esc(f.original_name) + '">' + I.trash + '</button>' : '') +
            '</div>' +
          '</div>';
      } else {
        html +=
          '<div class="file-row"' + selAttr + '>' +
            (isAdmin ? checkHtml + ' ' : '') +
            '<span class="file-icon">' + icon + '</span>' +
            '<div class="file-info">' +
              '<div class="name" title="' + this.esc(f.original_name) + '">' + this.esc(f.original_name) + '</div>' +
              '<div class="meta"><span class="badge">' + (f.category || '') + '</span><span>' + date + '</span>' + (sz ? '<span>' + sz + '</span>' : '') + '</div>' +
            '</div>' +
            '<div class="file-actions">' +
              (f.downloadPath ? (f.isHtml ? '<a href="/api/view-html?path=' + encodeURIComponent(f.original_name) + '" class="btn btn-ghost btn-sm" target="_blank">' + I.file + ' 查看</a>' : '<a href="' + f.downloadPath + '" class="btn btn-ghost btn-sm" download>' + I.download + '</a>') : '') +
              (isImg ? '<button class="btn btn-ghost btn-sm" data-img="' + (f.downloadPath || '') + '" data-name="' + this.escJS(f.original_name.replace(/\.[^.]+$/, '')) + '" onclick="App.imgPreview(this.dataset.img,this.dataset.name)">' + I.image + ' 预览</button>' : '') +
              (f.original_name && f.original_name.toLowerCase().endsWith('.md') && !isImg ? '<button class="btn btn-ghost btn-sm preview-btn" data-path="' + encodeURIComponent(f.path) + '" data-title="' + this.escJS(f.original_name) + '" onclick="App.preview(this.dataset.path,this.dataset.title)">' + I.file + ' 预览文档</button>' : '') +
              (isAdmin ? '<button class="btn btn-danger btn-sm del-file" data-path="' + this.esc(f.path) + '" data-name="' + this.esc(f.original_name) + '">' + I.trash + '</button>' : '') +
            '</div>' +
          '</div>';
      }
    }

    el.innerHTML = html;

    // Pagination
    if (tp > 1) {
      const pag = document.createElement('div');
      pag.style.cssText = 'grid-column:1/-1;text-align:center;display:flex;justify-content:center;align-items:center;gap:4px;padding-top:12px;padding-bottom:4px';
      pag.className = 'pagination';
      
      // 上一页
      const prevBtn = document.createElement('button');
      prevBtn.textContent = '‹';
      prevBtn.className = 'page-btn page-prev' + (pg <= 1 ? ' disabled' : '');
      prevBtn.title = '上一页';
      if (pg > 1) prevBtn.onclick = () => { this._page--; this.renderFilePage(); };
      pag.appendChild(prevBtn);
      
      // 页码 - 显示有限范围
      const maxVisible = 5;
      let pStart = Math.max(1, pg - Math.floor(maxVisible / 2));
      let pEnd = Math.min(tp, pStart + maxVisible - 1);
      if (pEnd - pStart + 1 < maxVisible) pStart = Math.max(1, pEnd - maxVisible + 1);
      
      if (pStart > 1) {
        const first = document.createElement('button');
        first.textContent = '1';
        first.className = 'page-btn page-number';
        first.onclick = () => { this._page = 1; this.renderFilePage(); };
        pag.appendChild(first);
        if (pStart > 2) {
          const dots = document.createElement('span');
          dots.textContent = '…';
          dots.style.cssText = 'padding:0 4px;color:var(--text-tertiary);font-size:12px';
          pag.appendChild(dots);
        }
      }
      
      for (let i = pStart; i <= pEnd; i++) {
        const btn = document.createElement('button');
        btn.textContent = '' + i;
        btn.className = 'page-btn page-number';
        if (i === pg) btn.classList.add('active');
        btn.onclick = (n => () => { this._page = n; this.renderFilePage(); })(i);
        pag.appendChild(btn);
      }
      
      if (pEnd < tp) {
        if (pEnd < tp - 1) {
          const dots = document.createElement('span');
          dots.textContent = '…';
          dots.style.cssText = 'padding:0 4px;color:var(--text-tertiary);font-size:12px';
          pag.appendChild(dots);
        }
        const last = document.createElement('button');
        last.textContent = '' + tp;
        last.className = 'page-btn page-number';
        last.onclick = () => { this._page = tp; this.renderFilePage(); };
        pag.appendChild(last);
      }
      
      // 下一页
      const nextBtn = document.createElement('button');
      nextBtn.textContent = '›';
      nextBtn.className = 'page-btn page-next' + (pg >= tp ? ' disabled' : '');
      nextBtn.title = '下一页';
      if (pg < tp) nextBtn.onclick = () => { this._page++; this.renderFilePage(); };
      pag.appendChild(nextBtn);
      
      // 信息
      const info = document.createElement('span');
      info.style.cssText = 'margin-left:12px;font-size:11px;color:var(--text-tertiary)';
      info.textContent = pg + '/' + tp;
      pag.appendChild(info);
      
      el.appendChild(pag);
    }

    if (isAdmin) {
      el.querySelectorAll('.del-file').forEach(btn => {
        btn.onclick = async () => {
          if (!await App.confirmAsync('确认删除"' + btn.dataset.name + '"？')) return;
          try {
            const r = await fetch('/api/delete', { method: 'DELETE', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: btn.dataset.path }) });
            if (r.ok) { if (this._activeCategoryView) this.openCategory(this._activeCategoryView); else this.renderCategoryCards(); }
            else { const d = await r.json(); App.toast('删除失败: ' + (d.error || ''), 'error'); }
          } catch { App.toast('网络错误','error'); }
        };
      });

      // 批量操作绑定
      this._bindFileBatchOps(el);
    }
  },

  _bindFileBatchOps(el) {
    // 行 checkbox 点击 → 更新计数
    const updateCount = () => {
      const checks = el.querySelectorAll('.file-check:checked');
      const count = checks.length;
      const countEl = document.getElementById('file-select-count');
      if (countEl) countEl.textContent = count;
      const delBtn = document.getElementById('file-batch-del-btn');
      if (delBtn) delBtn.disabled = count === 0;
      const catSelect = document.getElementById('file-batch-cat-select');
      if (catSelect) catSelect.disabled = count === 0;
      const catBtn = document.getElementById('file-batch-cat-btn');
      if (catBtn) catBtn.disabled = count === 0;
      const allCheck = document.getElementById('file-select-all');
      if (allCheck) allCheck.checked = count > 0 && count === el.querySelectorAll('.file-check').length;
    };

    el.querySelectorAll('.file-check').forEach(cb => {
      cb.onchange = updateCount;
    });

    // 全选
    const allCheck = document.getElementById('file-select-all');
    if (allCheck) {
      allCheck.onchange = function() {
        el.querySelectorAll('.file-check').forEach(cb => cb.checked = allCheck.checked);
        updateCount();
      };
    }

    // 批量编辑模式切换
    var toggleBtn = document.getElementById('batch-edit-toggle');
    if (toggleBtn) {
      toggleBtn.onclick = function() {
        var entering = !document.querySelector('.file-check-wrap.show');
        document.querySelectorAll('.file-check-wrap').forEach(function(w) { w.classList.toggle('show', entering); });
        document.getElementById('batch-select-label').style.display = entering ? 'flex' : 'none';
        document.getElementById('file-select-count').style.display = entering ? '' : 'none';
        toggleBtn.textContent = entering ? '✅ 完成编辑' : '✏️ 批量编辑';
        if (!entering) {
          document.querySelectorAll('.file-check').forEach(function(cb) { cb.checked = false; });
          document.getElementById('file-select-all').checked = false;
          var countEl = document.getElementById('file-select-count');
          if (countEl) countEl.textContent = '0';
          var delBtn = document.getElementById('file-batch-del-btn');
          if (delBtn) delBtn.disabled = true;
          var catBtn = document.getElementById('file-batch-cat-btn');
          if (catBtn) catBtn.disabled = true;
          var sel = document.getElementById('file-batch-cat-select');
          if (sel) sel.disabled = true;
        }
      };
    }

    // 批量删除
    document.getElementById('file-batch-del-btn').onclick = async () => {
      const checks = el.querySelectorAll('.file-check:checked');
      const count = checks.length;
      if (count === 0) return;
      if (!await App.confirmAsync('确认删除已选的 ' + count + ' 个文件？')) return;
      const paths = [];
      checks.forEach(cb => paths.push(cb.dataset.rpath));
      try {
        const r = await fetch('/api/files/batch-delete', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ paths }) });
        const d = await r.json();
        if (r.ok && d.success) {
          App.toast('已删除 ' + d.deleted + ' 个文件', 'success');
          this.reloadFiles();
        } else {
          App.toast('批量删除失败: ' + (d.error || ''), 'error');
        }
      } catch { App.toast('网络错误', 'error'); }
    };

    // 批量分类
    document.getElementById('file-batch-cat-btn').onclick = async () => {
      const checks = el.querySelectorAll('.file-check:checked');
      const count = checks.length;
      if (count === 0) return;
      const cat = document.getElementById('file-batch-cat-select').value;
      if (!cat) { App.toast('请选择目标分类', 'warning'); return; }
      const paths = [];
      checks.forEach(cb => paths.push(cb.dataset.rpath));
      try {
        const r = await fetch('/api/files/batch-category', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ paths, category: cat }) });
        const d = await r.json();
        if (r.ok && d.success) {
          App.toast('已移动 ' + d.updated + ' 个文件到 ' + cat, 'success');
          this.reloadFiles();
        } else {
          App.toast('批量分类失败: ' + (d.error || ''), 'error');
        }
      } catch { App.toast('网络错误', 'error'); }
    };
  },

  // ─── Animations ───
  animateStaggered(container, selector, delayMs) {
    const items = container.querySelectorAll(selector);
    if (!items.length) return;
    items.forEach((el, i) => {
      el.classList.add("anim-stag");
      setTimeout(() => el.classList.add("show"), i * delayMs);
    });
  },

  // ─── Ripple ───
  setupRipple() {
    document.querySelectorAll(".btn").forEach(btn => {
      btn.addEventListener("click", function(e) {
        const rect = this.getBoundingClientRect();
        const r = document.createElement("span");
        r.className = "ripple";
        const size = Math.max(rect.width, rect.height) * 2;
        r.style.width = r.style.height = size + "px";
        r.style.left = (e.clientX - rect.left - size / 2) + "px";
        r.style.top = (e.clientY - rect.top - size / 2) + "px";
        this.appendChild(r);
        setTimeout(() => r.remove(), 600);
      });
    });
  },

  // ─── Search Suggestions ───
  _sugTimeout: null, _sugIndex: -1, _sugItems: null,
  setupSuggestions() {
    const input = document.getElementById("search-input");
    if (!input) return;
    input.addEventListener("input", () => {
      clearTimeout(this._sugTimeout);
      const q = input.value.trim();
      if (q.length < 1) { this._hideSuggestions(); return; }
      this._sugTimeout = setTimeout(() => this._fetchSuggestions(q), 300);
    });
    input.addEventListener("keydown", (e) => {
      if (e.key === "ArrowDown") { e.preventDefault(); this._sugNavigate(1); }
      else if (e.key === "ArrowUp") { e.preventDefault(); this._sugNavigate(-1); }
      else if (e.key === "Enter") { this._sugConfirm(); }
      else if (e.key === "Escape") { this._hideSuggestions(); }
    });
    if (!window._sugListener) {
      document.addEventListener("click", (e) => {
        const wrap = document.getElementById("suggestions-wrap");
        if (wrap && !wrap.contains(e.target)) setTimeout(() => this._hideSuggestions(), 200);
      });
      window._sugListener = true;
    }
  },
  async _fetchSuggestions(q) {
    try {
      const r = await fetch("/api/search?q=" + encodeURIComponent(q));
      const d = await r.json();
      const results = Array.isArray(d) ? d : (d.results || []);
      const titles = results.filter(x => x.original_name).slice(0, 5);
      this._showSuggestions(titles, q);
    } catch {}
  },
  _showSuggestions(items, query) {
    const existing = document.getElementById("suggestions-dropdown");
    if (existing) existing.remove();
    if (!items.length) return;
    this._sugItems = items;
    this._sugIndex = -1;
    const wrap = document.getElementById("suggestions-wrap");
    if (!wrap) return;
    const dd = document.createElement("div");
    dd.id = "suggestions-dropdown";
    dd.className = "suggestions-dropdown show";
    dd.innerHTML = items.map((f, i) =>
      "<div class=\"sug-item\" data-idx=\"" + i + "\">" +
        "<span class=\"sug-icon\">" + I.file + "</span>" +
        "<span class=\"sug-name\">" + this.esc(f.original_name) + "</span>" +
        (f.category ? "<span class=\"badge sug-cat\">" + this.esc(f.category) + "</span>" : "") +
      "</div>"
    ).join("");
    dd.addEventListener("click", (e) => {
      const item = e.target.closest(".sug-item");
      if (item) {
        const idx = parseInt(item.dataset.idx);
        const f = this._sugItems[idx];
        if (f) { const inp = document.getElementById('hero-search-input') || document.getElementById('search-input'); inp.value = f.original_name; this._hideSuggestions(); this.doSearch(); }
      }
    });
    wrap.appendChild(dd);
  },
  _hideSuggestions() {
    const dd = document.getElementById("suggestions-dropdown");
    if (dd) { dd.classList.remove("show"); setTimeout(() => dd.remove(), 200); }
    this._sugItems = null; this._sugIndex = -1;
  },
  _sugNavigate(dir) {
    const items = this._sugItems;
    if (!items || !items.length) return;
    this._sugIndex = Math.max(-1, Math.min(items.length - 1, this._sugIndex + dir));
    document.querySelectorAll(".sug-item").forEach((el, i) => el.classList.toggle("active", i === this._sugIndex));
  },
  _sugConfirm() {
    const items = this._sugItems;
    if (!items || this._sugIndex < 0 || !items[this._sugIndex]) return;
    const f = items[this._sugIndex];
    const inp = document.getElementById('hero-search-input') || document.getElementById('search-input');
    inp.value = f.original_name;
    this._hideSuggestions();
    this.doSearch();
  },

  // ─── Search ───
  _searchAbort: null,
  async doSearch() {
    const searchInput = document.getElementById('hero-search-input') || document.getElementById('search-input');
    const q = searchInput.value.trim();
    const cat = document.getElementById('search-category') ? document.getElementById('search-category').value : '';
    if (!q) { this._activeCategoryView = null; this.renderCategoryCards(); document.getElementById('search-stats').textContent = ''; return; }
    this._lastQuery = q; this._lastCategory = cat; this._activeCategoryView = null;
    try {
      if (this._searchAbort) this._searchAbort.abort();
      this._searchAbort = new AbortController();
      const r = await fetch('/api/search?q=' + encodeURIComponent(q) + (cat ? '&category=' + encodeURIComponent(cat) : ''), { signal: this._searchAbort.signal });
      const d = await r.json();
      const results = Array.isArray(d) ? d : (d.results || []);
      const cnt = typeof d.count === 'number' ? d.count : results.length;
      const ca = document.getElementById('content-area');
      ca.innerHTML =
        '<div class="mb-3"><div style="font-size:15px;font-weight:600"><span style="font-size:20px">' + I.search + '</span> 搜索结果</div></div>' +
        '<div id="search-results-list"></div>';
      document.getElementById('search-stats').textContent = '搜索 "' + q + '" — 找到 ' + cnt + ' 条结果';
      const el = document.getElementById('search-results-list');
      if (!results.length) { el.innerHTML = '<div class="empty-state"><div class="empty-icon">' + I.search + '</div><div class="empty-text">未找到相关内容</div></div>'; return; }
      const kws = this._extractKeywords(q);
      let html = '';
      for (const r of results) {
        const title = this.esc((r.original_name || r.title || r.name || '')).replace(/\.md$/i, '.' + (r.original_ext || '').toLowerCase());
        const hlTitle = this._highlight(title, kws);
        const hlSnippet = this._highlight(this.esc(r.snippet || ''), kws);
        const mdPath = r.path || '';
        const imgExts = ['PNG','JPG','JPEG','GIF','WEBP','SVG'];
        const isImg = imgExts.includes((r.original_ext || '').toUpperCase());
        html +=
          '<div class="search-result-item mb-2">' +
            '<div class="sr-title">' + hlTitle + '</div>' +
            '<div class="sr-meta"><span class="badge badge-primary">' + this.esc(r.category || '') + '</span><span>' + (r.created_at ? r.created_at.slice(0,10) : '') + '</span>' + (r.image_count > 0 ? '<span>📷 ' + r.image_count + '</span>' : '') +
            (r.original_ext ? '<span class="badge">' + this.esc(r.original_ext) + '</span>' : '') +
              (r.score ? '<span style="color:var(--' + (r.method === '语义检索' ? 'primary' : 'tertiary') + ')">' + this.esc(r.method || '搜索') + ' · 置信度 ' + Math.round(r.score * 100) + '%</span>' : '') +
            '</div>' +
            '<div class="sr-snippet snippet">' + hlSnippet + '</div>' +
            '<div class="mt-2 flex gap-2">' +
                      (isImg ? '<button class="btn btn-ghost btn-sm" data-img="' + (r.originalDownloadPath || '') + '" data-name="' + this.escJS(title.split('.').slice(0,-1).join('.') || title) + '" onclick="App.imgPreview(this.dataset.img,this.dataset.name)">' + I.image + ' 预览图片</button>' : '') +
              (r.originalDownloadPath ? (/\.html?$/i.test(r.originalDownloadPath) ? '<a href="/api/view-html?path=' + encodeURIComponent(r.originalFile ? r.originalFile.replace('/home/zhang/company_knowledge_base/', '') : '') + '" class="btn btn-ghost btn-sm" target="_blank">' + I.file + ' 查看</a>' : '<a href="' + r.originalDownloadPath + '" class="btn btn-ghost btn-sm" download>' + I.download + ' 下载原始文件</a>') : '') +
              (mdPath && !isImg ? '<button class="btn btn-ghost btn-sm preview-btn" data-path="' + encodeURIComponent(mdPath) + '" data-title="' + this.escJS(title) + '" onclick="App.preview(this.dataset.path,this.dataset.title)">' + I.file + ' 预览文档</button>' : '') +
            '</div>' +
          '</div>';
      }
      el.innerHTML = html;
    } catch(e) { if (e.name !== 'AbortError') document.getElementById('search-stats').textContent = '搜索失败，请重试'; }
  },

  _extractKeywords(q) {
    let w = q.split(/[\s,，、;；：]+/).filter(x => x.length >= 2);
    if (!w.length) {
      const ch = q.replace(/[^\u4e00-\u9fff\da-zA-Z]/g, '');
      if (ch.length >= 4) { w = []; for (const l of [4,3,2]) for (let i=0;i<=ch.length-l;i++) w.push(ch.substring(i,i+l)); }
      else if (ch.length >= 2) w = [ch];
      else w = [q];
    } else {
      // Expand each token with 2-3 char ngrams to catch subword matches
      const extra = [];
      for (const token of w) {
        const ch = token.replace(/[^\u4e00-\u9fff\da-zA-Z]/g, '');
        if (ch.length >= 4) {
          for (const l of [3,2]) for (let i=0;i<=ch.length-l;i++) extra.push(ch.substring(i,i+l));
        } else if (ch.length >= 2) {
          extra.push(ch);
        }
      }
      w = w.concat(extra);
    }
    // Deduplicate and sort longest first
    w = [...new Set(w)];
    w.sort((a,b) => b.length - a.length);
    return w;
  },

  _highlight(text, kws) {
    if (!text || !kws || !kws.length) return text || '';
    const parts = kws.filter(k => k.length >= 2).map(k => k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
    if (!parts.length) return text;
    const re = new RegExp('(' + parts.join('|') + ')', 'gi');
    const matches = []; let m;
    while ((m = re.exec(text)) !== null) matches.push({ idx: m.index, len: m[0].length, word: m[0] });
    matches.sort((a,b) => a.idx - b.idx);
    let r = '', last = 0;
    for (const mt of matches) {
      if (mt.idx < last) continue;
      r += text.substring(last, mt.idx) + '<mark>' + mt.word + '</mark>';
      last = mt.idx + mt.len;
    }
    r += text.substring(last);
    return r;
  },

  // ─── Preview ───
  async preview(mdPath, title) {
    try {
      const r = await fetch('/api/preview?path=' + mdPath);
      if (!r.ok) { App.toast('无法加载文档','error'); return; }
      const d = await r.json();
      if (!d.success) { App.toast('无法加载文档','error'); return; }

      // 预览内容：优先使用 HTML 渲染（含图片），备选纯文本
      const hasHtml = d.html_content && d.html_content.trim().length > 0;
      let renderedHtml = '';
      let textHtml = '';

      if (hasHtml) {
        // 替换图片路径：_images/xxx → /api/download/相对路径
        // 从 d.path 获取目录前缀
        const mdDir = d.path ? d.path.substring(0, d.path.lastIndexOf('/') + 1) : '';
        let finalHtml = d.html_content;
        // 将 _images/xxx.png 替换为正确的 /api/download/ 路径
        finalHtml = finalHtml.replace(/src="_images\/([^"]+)"/g, (m, imgName) => {
          const imgRelPath = mdDir + '_images/' + imgName;
          return 'src="/api/download/' + encodeURIComponent(imgRelPath) + '"';
        });
        renderedHtml = '<div class="html-rendered-content" style="font-size:14px;line-height:1.8;padding:4px 0">' + finalHtml + '</div>';
      }

      const allLines = this.esc(d.content).split('\n');
      const maxLines = 99999;
      const showAll = allLines.length <= maxLines;
      const displayLines = showAll ? allLines : allLines.slice(0, maxLines);
      const remaining = showAll ? 0 : allLines.length - maxLines;
      textHtml = '<pre style="font-size:13px;line-height:1.7;font-family:monospace;white-space:pre-wrap;word-break:break-word;margin:0">' + displayLines.join('\n') + '</pre>';
      if (remaining > 0) {
        textHtml += '<div class="mt-2 text-center"><button class="btn btn-ghost btn-sm" id="show-all-btn">显示全部内容 (' + remaining + ' 行)</button></div>';
      }

      // 图片查看按钮
      let imagesHtml = '';
      if (d.images && d.images.length > 0) {
        var imagesJson = this.escJS(JSON.stringify(d.images));
        imagesHtml = '<div class="mt-2 flex gap-2"><button class="btn btn-ghost btn-sm" data-imgs="' + imagesJson + '" onclick="App.showImageGallery(JSON.parse(this.dataset.imgs))">' +
          I.image + ' 查看图片 (' + d.images.length + ')</button></div>';
      }

      const hasLayout = d.layout_text && d.layout_text.trim();
      const layoutEsc = hasLayout ? this.esc(d.layout_text) : '';

      const modal = document.createElement('div');
      modal.className = 'modal-overlay'; modal.classList.add('show');
      modal.onclick = function(e) { if (e.target === this) this.remove(); };
      window.__previewHtmlContent = '';
      window.__originalPreHtml = '';
      modal.setAttribute('data-view-mode', 'normal');
      let toggleBtn = '';
      if (hasLayout) {
        toggleBtn = '<button class="btn btn-ghost btn-sm" id="layout-toggle-btn" onclick="App.togglePreviewLayout(this)">📐 布局视图</button>';
      }
      modal.innerHTML =
        '<div class="modal" style="max-width:800px">' +
          '<div class="flex justify-between items-center mb-3">' +
            '<div class="modal-title truncate" style="margin-bottom:0">' + this.esc(title) + '</div>' +
            '<button class="btn btn-ghost btn-sm" onclick="this.closest(\'.modal-overlay\').remove()">' + I.close + '</button>' +
          '</div>' +
          '<div style="margin-bottom:8px;display:flex;gap:6px">' +
            '<input type="text" class="input" id="preview-search-input" placeholder="在文档中搜索…" style="flex:1;font-size:13px;padding:5px 8px" onkeydown="if(event.keyCode===13){App.searchInPreview(event)}">' +
            '<button class="btn btn-ghost btn-sm" onclick="App.searchInPreview(this)">' + I.search + '</button>' +
            toggleBtn +
            (hasHtml ? '<button class="btn btn-ghost btn-sm" id="toggle-html-btn" onclick="App.toggleHtmlPreview(this)">📝 原文</button>' : '') +
          '</div>' +
          '<div class="preview-content">' + (renderedHtml || textHtml) + '</div>' +
          imagesHtml +
        '<div style="margin-top:6px;display:flex;gap:6px"></div>';
      document.body.appendChild(modal);

      // Store layout text and html/raw text on modal for toggle
      if (hasLayout) {
        modal._layoutText = layoutEsc;
        modal._normalHtml = textHtml;
      }
      if (hasHtml) {
        modal._htmlContent = renderedHtml;
        modal._rawContent = textHtml;
        modal.setAttribute('data-html-mode', 'html');
      }

      // "显示全部" 按钮
      const showAllBtn = document.getElementById('show-all-btn');
      if (showAllBtn) {
        showAllBtn.onclick = function() {
          const pc = this.closest('.modal').querySelector('.preview-content');
          const thePre = pc.querySelector('pre');
          if (thePre) thePre.outerHTML = '<pre style="font-size:13px;line-height:1.7;font-family:monospace;white-space:pre-wrap;word-break:break-word;margin:0">' + allLines.join('\n') + '</pre>';
          this.remove();
        };
      }

      // Ensure all img src are resolved to /api/download/ paths
      if (hasHtml) {
        setTimeout(() => {
          modal.querySelectorAll('.html-rendered-content img').forEach(img => {
            const src = img.getAttribute('src');
            if (src && src.startsWith('_images/')) {
              const mdDir = d.path ? d.path.substring(0, d.path.lastIndexOf('/') + 1) : '';
              img.src = '/api/download/' + encodeURIComponent(mdDir + src);
            }
          });
        }, 100);
      }

    } catch (e) { App.toast('预览加载失败: ' + (e.message || ''), 'error'); }
  },

  // ─── Toggle between HTML rendered view and raw Markdown view ───
  toggleHtmlPreview(btn) {
    const modal = btn.closest('.modal-overlay');

  // ─── Toggle between normal view and layout view ───
  togglePreviewLayout(btn) {
    const modal = btn.closest('.modal-overlay');
    const pc = modal.querySelector('.preview-content');
    const mode = modal.getAttribute('data-view-mode');
    if (mode === 'layout') {

  // ─── Search in preview content ───
  searchInPreview(btnOrEvent) {
    let btn = btnOrEvent;
    // 如果是键盘事件（回车），从 event.target 找按钮
    if (btnOrEvent && btnOrEvent.key !== undefined) {
      const inp = btnOrEvent.target;
      btn = inp.nextElementSibling || inp.parentElement.querySelector('button');
    }
    const modal = btn.closest('.modal-overlay');
    const input = modal.querySelector('#preview-search-input');
    const q = (input.value || '').toLowerCase().trim();
    if (!q) return;
    // 支持两种模式：纯文本 <pre> 和 HTML 渲染 <div class="html-rendered-content">
    const previewContent = modal.querySelector('.preview-content');
    const pre = previewContent.querySelector('pre');
    if (!pre) return;  
    // 重建原始 pre 内容（之前的高亮标记不要了）
    this._rebuildPreviewContent(modal, pre);
    
    const text = pre.textContent || '';
    const lines = text.split('\n');
    
    // 找到所有匹配行的索引
    const matchIndices = [];
    for (let i = 0; i < lines.length; i++) { if (lines[i].toLowerCase().includes(q)) matchIndices.push(i); }
    if (matchIndices.length === 0) return;
    
    // 用 innerHTML 实现高亮：每行使用 <span> 包裹
    let html = '';
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      let escaped = line.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      if (matchIndices.includes(i)) {
        // 高亮整行：用普通的背景色 span
        html += '<span style="display:block;background:#3B82F6;color:#fff">' + escaped + '</span>';
      } else {
        html += '<span style="display:block">' + escaped + '</span>';
      }
    }
    pre.innerHTML = html;
    // 滚动到第一个匹配
    const firstIdx = matchIndices[0];
    const container = pre.parentElement;
    // 把第一个匹配行滚动到可见区域
    const spans = pre.children;
    if (spans[firstIdx]) {
      const top = spans[firstIdx].offsetTop - container.offsetTop - 60;
      container.scrollTop = Math.max(0, top);
    }
  },
  _rebuildPreviewContent(modal, pre) {
    // 把 <pre> 内的高亮 html 恢复成纯文本（只在之前是 html 格式时执行）
    if (pre.children.length === 0) return;
    const lines = [];
    for (const span of pre.children) {
      lines.push(span.textContent || '');
    }
    pre.textContent = lines.join('\n');
  },

  viewImage(src, allImages) {
    const ov = document.createElement('div');
    ov.className = 'img-gallery-full';
    ov.onclick = () => ov.remove();
    // 构建图片列表
    let picList = [];
    let curIdx = -1;
    if (Array.isArray(allImages) && allImages.length > 1) {
      picList = allImages;
      curIdx = allImages.indexOf(src);
      if (curIdx === -1) curIdx = 0;
    }
    const imgTag = '<img id="gallery-img" src="' + this.esc(src) + '" onclick="event.stopPropagation()" style="max-width:90vw;max-height:90vh;object-fit:contain">';
    const closeTag = '<div style="position:fixed;top:16px;right:20px;z-index:10001;cursor:pointer;color:#fff;font-size:24px;opacity:.7;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(0,0,0,.4)" onclick="this.parentElement.remove()" title="关闭">' + I.close + '</div>';
    // 用 data attribute + DOM 操作处理左右箭头，避免 onclick 内嵌字符串引号冲突
    ov.innerHTML = closeTag + imgTag;
    document.body.appendChild(ov);
    // 左右箭头用纯 DOM 添加，避开字符串引号问题
    if (picList.length > 1) {
      const leftArrows = ['prev', curIdx - 1 >= 0 ? curIdx - 1 : picList.length - 1];
      const rightArrows = ['next', curIdx + 1 < picList.length ? curIdx + 1 : 0];
      for (const [dir, targetIdx] of [leftArrows, rightArrows]) {
        const btn = document.createElement('div');
        btn.textContent = dir === 'prev' ? '‹' : '›';
        Object.assign(btn.style, {
          position: 'fixed', top: '50%', zIndex: '10001', cursor: 'pointer', color: '#fff',
          fontSize: '32px', opacity: '.7', width: '44px', height: '44px',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          borderRadius: '50%', background: 'rgba(0,0,0,.4)',
          ...(dir === 'prev' ? { left: '12px' } : { right: '12px' })
        });
        btn.onclick = () => App.viewImage(picList[targetIdx], picList);
        btn.title = dir === 'prev' ? '上一张' : '下一张';
        ov.appendChild(btn);
      }
    }
  },

      tb.querySelectorAll('.edit-user').forEach(btn => {
        btn.onclick = async () => {
          const newRole = prompt('输入新角色 (admin/user):');
          if (!newRole || (newRole !== 'admin' && newRole !== 'user')) return;
          const r = await fetch('/api/users/' + btn.dataset.id, { method: 'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({role:newRole}) });
          if (r.ok) this.loadUsers(); else { const d = await r.json(); App.toast(d.error || '编辑失败','error'); }
        };
      });
      tb.querySelectorAll('.dis-user').forEach(btn => {
        btn.onclick = async () => {
          const r = await fetch('/api/users/' + btn.dataset.id + '/status', { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({status:'disabled'}) });
          if (r.ok) this.loadUsers(); else App.toast('禁用失败','error');
        };
      });
      tb.querySelectorAll('.en-user').forEach(btn => {
        btn.onclick = async () => {
          const r = await fetch('/api/users/' + btn.dataset.id + '/status', { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({status:'active'}) });
          if (r.ok) this.loadUsers(); else App.toast('启用失败','error');
        };
      });
      tb.querySelectorAll('.reset-pw-user').forEach(btn => {
        btn.onclick = async () => {
          const pw = prompt('输入新密码（至少6位）:');
          if (!pw || pw.length < 6) return;
          const r = await fetch('/api/users/' + btn.dataset.id + '/reset-password', { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify({password:pw}) });
          if (r.ok) { App.toast('密码已重置','success'); this.loadUsers(); } else { const d = await r.json(); App.toast(d.error || '重置失败','error'); }
        };
      });

      if (tb) tb.innerHTML = '<tr><td colspan="6" style="color:#EF4444;text-align:center;padding:16px">加载失败</td></tr>';

  // ─── Admin: Logs ───
  async renderAdminLogs(container) {
    this._renderTopbar('操作日志');
    const self = this;
    let curPage = 1, totalPages = 1, totalItems = 0;
    container.innerHTML =
      '<div style="font-size:16px;font-weight:600;margin-bottom:16px">操作日志</div>' +
      '<div class="flex gap-2 items-center mb-4">' +
        '<select id="log-action-filter" class="input" style="width:auto;padding:4px 10px;font-size:12px">' +
          '<option value="">所有操作类型</option>' +
        '</select>' +
        '<button class="btn btn-secondary btn-sm" id="log-refresh">刷新</button>' +
        '<span id="log-total" style="font-size:12px;color:var(--text-tertiary)"></span>' +
      '</div>' +
      '<div class="table-wrap"><table><thead><tr><th>时间</th><th>操作人</th><th>操作</th><th>详情</th></tr></thead><tbody id="log-tbody"></tbody></table></div>' +
      '<div class="flex justify-center items-center gap-1 mt-3" id="log-pagination" style="display:none"></div>';

    const loadFilters = async () => {
      try {
        const r = await fetch('/api/log-actions');
        const acts = await r.json();
        const sel = document.getElementById('log-action-filter');
        if (!sel) return;
        sel.innerHTML = '<option value="">所有操作类型</option>';
        const labels = { login:'登录', logout:'登出', upload:'上传文件', delete:'删除文件', user_create:'创建用户', user_edit:'编辑用户', user_disable:'禁用用户', user_enable:'启用用户', password_reset:'重置密码' };
        acts.forEach(function(a){ sel.innerHTML += '<option value="'+a+'">'+(labels[a]||a)+'</option>'; });
      } catch(e) {}
    };

    const load = async () => {
      const action = document.getElementById('log-action-filter').value;
      try {
        const r = await fetch('/api/logs?action=' + encodeURIComponent(action) + '&page=' + curPage + '&perPage=50');
        const d = await r.json();
        const logs = d.logs || [];
        totalPages = d.totalPages || 1;
        totalItems = d.total || 0;
        document.getElementById('log-total').textContent = '共 ' + totalItems + ' 条';
        const tb = document.getElementById('log-tbody');
        if (!logs.length) { tb.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:16px;color:var(--text-tertiary)">暂无日志</td></tr>'; document.getElementById('log-pagination').style.display = 'none'; return; }
        const labels = { login:'登录', logout:'登出', upload:'上传文件', delete:'删除文件', user_create:'创建用户', user_edit:'编辑用户', user_disable:'禁用用户', user_enable:'启用用户', password_reset:'重置密码' };
        tb.innerHTML = logs.map(l =>
          '<tr>' +
            '<td style="color:var(--text-secondary);white-space:nowrap;font-size:12px">' + self.esc(l.created_at ? l.created_at.replace('T',' ') : '') + '</td>' +
            '<td>' + self.esc(l.username || '-') + '</td>' +
            '<td><span class="badge">' + self.esc(labels[l.action] || l.action) + '</span></td>' +
            '<td style="color:var(--text-secondary);font-size:12px">' + self.esc(l.detail || '-') + '</td>' +
          '</tr>'
        ).join('');
        renderPagination();
      } catch { document.getElementById('log-tbody').innerHTML = '<tr><td colspan="4" style="color:#EF4444;text-align:center;padding:16px">加载失败</td></tr>'; }
    };

    const renderPagination = () => {
      const pg = document.getElementById('log-pagination');
      if (!pg) return;
      if (totalPages <= 1) { pg.style.display = 'none'; return; }
      pg.style.display = 'flex';
      let html = '';
      const seq = [];
      seq.push(1);
      let s = Math.max(2, curPage-1), e = Math.min(totalPages-1, curPage+1);
      if (curPage <= 3) { s = 2; e = Math.min(4, totalPages-1); }
      else if (curPage >= totalPages-2) { s = Math.max(2, totalPages-3); e = totalPages-1; }
      for (let i = s; i <= e; i++) seq.push(i);
      if (totalPages > 1) seq.push(totalPages);
      seq.sort((a,b) => a-b);
      let prev = 0;
      seq.forEach(function(p) {
        if (prev + 1 < p) html += '<span style="padding:2px 4px;color:var(--text-tertiary)">…</span>';
        html += '<button class="log-page-btn btn btn-sm ' + (p === curPage ? 'btn-primary' : 'btn-ghost') + '" data-p="' + p + '">' + p + '</button>';
        prev = p;
      });
      pg.innerHTML = html;
      pg.querySelectorAll('.log-page-btn').forEach(function(btn) {
        btn.onclick = function() { curPage = parseInt(this.dataset.p); load(); };
      });
    };

    loadFilters();
    await load();
    document.getElementById('log-refresh').onclick = load;
    document.getElementById('log-action-filter').onchange = function() { curPage = 1; load(); };
  },

  // ─── FAQ ───
  async renderFaq(container) {
    this._renderTopbar('密评 FAQ');
    container.innerHTML =
      '<div style="font-size:16px;font-weight:600;margin-bottom:4px">密评 FAQ</div>' +
      '<div id="faq-stats" style="font-size:12px;color:var(--text-tertiary);margin-bottom:10px"></div>' +
      '<div class="mb-4 flex gap-2"><input id="faq-search" class="input" placeholder="搜索 FAQ..." style="max-width:400px"></div>' +
      '<div id="faq-list"></div>' +
      '<div id="faq-pagination" class="faq-pagination"></div>';

    const PAGE_SIZE = 20;
    var currentPage = 1;
    var allItems = [];
    var currentQuery = '';

    const mkKws = (q) => q ? q.trim().split(/[\s,，、]+/).filter(s => s.length >= 2) : [];

    const highlightOrEsc = (text, kws) => {
      if (!text) return '';
      if (!kws || !kws.length) return this.esc(text);
      return this._highlight(this.esc(text), kws);
    };

    var _fileResolveCache = {};
    var _fileResolvePromise = null;

    const _resolveFiles = async (text) => {
      if (!_fileResolvePromise) {
        _fileResolvePromise = (async () => {
          var names = new Set();
          var fileRe = /^[\w\-. ()（）\u4e00-\u9fff]+\.(doc|docx|pdf|xls|xlsx|html?|md|txt|ppt|pptx)$/i;
          var lines = text.split(/\r?\n/);
          for (var line of lines) {
            var t = line.trim();
            if (fileRe.test(t)) names.add(t);
          }
          for (var name of names) {
            try {
              var resp = await fetch('/api/faq/resolve-file?name=' + encodeURIComponent(name));
              var result = await resp.json();
              if (result.found) _fileResolveCache[name] = result;
            } catch(e) {}
          }
        })();
      }
      return _fileResolvePromise;
    };

    const resolveFileUrl = (name) => {
      var r = _fileResolveCache[name];
      if (!r) return null;
      return { href: r.downloadUrl, isHtml: r.isHtml, relPath: r.relPath };
    };

    const formatAnswer = (text, kws) => {
      if (!text) return '';
      var escText = highlightOrEsc(text, kws);
      var lines = escText.split(/\r?\n/);
      var inList = false;
      var out = '';
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i].trim();
        if (!line) {
          if (inList) { out += '</ul>'; inList = false; }
          continue;
        }
        // 本地文件路径链接（/home/... 绝对路径）
        var fileMatch = line.match(/^(.+?):\s*(\/.+)$/);
        if (fileMatch && fileMatch[2].startsWith('/home/zhang/company_knowledge_base/')) {
          var label = fileMatch[1];
          var fullPath = fileMatch[2];
          var relPath = fullPath.replace('/home/zhang/company_knowledge_base/', '');
          var fileName = relPath.split('/').pop();
          var isHtml = /\.html?$/i.test(fileName);
          var href = isHtml ? '/api/view-html?path=' + encodeURIComponent(relPath) : '/api/download/' + encodeURIComponent(relPath);
          out += '<p>' + this.esc(label) + ': <a href="' + href + '" target="_blank" class="source-link">' + this.esc(fileName) + '</a></p>';
          continue;
        }
        // 裸绝对路径行
        if (line.startsWith('/home/zhang/company_knowledge_base/')) {
          var relPath = line.replace('/home/zhang/company_knowledge_base/', '');
          var fileName = relPath.split('/').pop();
          var isHtml = /\.html?$/i.test(fileName);
          var href = isHtml ? '/api/view-html?path=' + encodeURIComponent(relPath) : '/api/download/' + encodeURIComponent(relPath);
          out += '<p><a href="' + href + '" target="_blank" class="source-link">📄 ' + this.esc(fileName) + '</a></p>';
          continue;
        }
        // 纯文件名行（在知识库中查找）
        var fileRe = /^[\w\-. ()（）\u4e00-\u9fff]+\.(doc|docx|pdf|xls|xlsx|html?|md|txt|ppt|pptx)$/i;
        if (fileRe.test(line)) {
          var resolved = resolveFileUrl(line);
          if (resolved) {
            out += '<p><a href="' + resolved.href + '" target="_blank" class="source-link">📄 ' + this.esc(line) + '</a></p>';
            continue;
          }
        }
        // 列表行：- 或 * 开头
        if (line.match(/^[\-\*]\s/)) {
          if (!inList) { out += '<ul>'; inList = true; }
          out += '<li>' + line.slice(2) + '</li>';
        } else {
          if (inList) { out += '</ul>'; inList = false; }
          out += '<p>' + line + '</p>';
        }
      }
      if (inList) out += '</ul>';
      return out;
    };

    const renderItems = () => {
      const start = (currentPage - 1) * PAGE_SIZE;
      const end = start + PAGE_SIZE;
      const page = allItems.slice(start, end);
      const el = document.getElementById('faq-list');
      const kws = mkKws(currentQuery);
      if (!page.length) {
        el.innerHTML = '<div class="empty-state"><div class="empty-icon">' + I.inbox + '</div><div class="empty-text">暂无 FAQ 条目</div></div>';
        document.getElementById('faq-pagination').innerHTML = '';
        return;
      }
      el.innerHTML = page.map((f, i) =>
        '<div class="faq-item">' +
          '<div class="faq-q" data-id="' + f.id + '">' +
            '<div class="faq-q-header">' +
              '<span class="faq-q-label">Q' + (start + i + 1) + '</span>' +
              '<span class="faq-q-text">' + highlightOrEsc(f.question, kws) + (f.extracted ? ' <span class="faq-extract-badge">🤖</span>' : '') + '</span>' +
            '</div>' +
            '<span class="faq-arrow">▼</span>' +
          '</div>' +
          '<div class="faq-a">' +
            '<div class="faq-a-q">解答</div>' +
            '<div class="faq-a-body">' + formatAnswer(f.answer, kws) + '</div>' +
            (f.source_file ? '<div class="faq-meta" style="margin-top:10px;padding-top:8px;border-top:1px solid var(--border);font-size:12px">📄 <a class="source-link" onclick="App.previewSourceFile(\'' + this.escAttr(f.source_file) + '\')">' + this.esc(f.source_file) + '</a></div>' : '') +
          '</div>' +
        '</div>'
      ).join('');

      el.querySelectorAll('.faq-q').forEach(q => {
        q.onclick = () => {
          const a = q.nextElementSibling;
          a.classList.toggle('open');
          q.classList.toggle('open');
          q.querySelector('.faq-arrow').textContent = a.classList.contains('open') ? '▲' : '▼';
        };
      });

      // 翻页器
      const totalPages = Math.ceil(allItems.length / PAGE_SIZE);
      let html = '';
      html += '<button class="faq-page-btn" onclick="App._faqGoPage(' + (currentPage - 1) + ')" ' + (currentPage <= 1 ? 'disabled' : '') + '>‹ 上一页</button>';
      for (let p = 1; p <= totalPages; p++) {
        if (p === currentPage || p === 1 || p === totalPages || Math.abs(p - currentPage) <= 2) {
          html += '<button class="faq-page-btn' + (p === currentPage ? ' active' : '') + '" onclick="App._faqGoPage(' + p + ')">' + p + '</button>';
        } else if (html.slice(-6) !== '...</span>') {
          html += '<span style="color:var(--text-tertiary);padding:0 4px">...</span>';
        }
      }
      html += '<button class="faq-page-btn" onclick="App._faqGoPage(' + (currentPage + 1) + ')" ' + (currentPage >= totalPages ? 'disabled' : '') + '>下一页 ›</button>';
      html += '<span style="font-size:12px;color:var(--text-tertiary);margin-left:8px">共 ' + allItems.length + ' 条</span>';
      document.getElementById('faq-pagination').innerHTML = html;
    };

    if (!this._faqGoPage) {
      this._faqGoPage = (page) => {
        currentPage = page;
        renderItems();
      };
    }

    const load = async (q) => {
      try {
        currentQuery = q || '';
        var params = new URLSearchParams();
        if (q) params.set('q', q);
        var url = '/api/faq?' + params.toString();
        const r = await fetch(url);
        allItems = await r.json();
        // 统计
        const statsEl = document.getElementById('faq-stats');
        if (statsEl) {
          const cats = {};
          allItems.forEach(f => { cats[f.category] = (cats[f.category] || 0) + 1; });
          statsEl.textContent = '共 ' + allItems.length + ' 条';
        }
        currentPage = 1;
        // 提前解析所有 FAQ 回答中的文件名
        _fileResolveCache = {};
        _fileResolvePromise = null;
        var allText = allItems.map(function(f) { return f.answer || ''; }).join('\n');
        renderItems();
        // 异步解析文件后重绘（使文件名变成可点击链接）
        _resolveFiles(allText).then(function() { renderItems(); });
      } catch { document.getElementById('faq-list').innerHTML = '<div class="empty-state"><div class="empty-icon">' + I.alertTriangle + '</div><div class="empty-text">加载失败</div></div>'; }
    };

    if (!this.previewSourceFile) {
      this.previewSourceFile = async (fileName) => {
        var item = { name: fileName };
        App.showFileDetail(item);
      };
    }

    await load('');
    document.getElementById('faq-search').onkeydown = (e) => { if (e.key === 'Enter') load(e.target.value.trim()); };
  },
