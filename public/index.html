  <meta charset="UTF-8">

  <title>密码应用安全知识库</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* #particle-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none} */
    :root {
      --primary: #2563EB; --primary-hover: #1D4ED8; --primary-light: #EFF6FF;
      --primary-border: #BFDBFE; --primary-glow: rgba(37,99,235,0.15); --accent: #2563EB;
      --text-primary: #0B1628; --text-secondary: #1E2A44; --text-tertiary: #3B4A66; --text-muted: #94A3B8;
      --bg-body: #F8FAFC; --bg-card: #FFFFFF; --bg-subtle: #F1F5F9;
      --border: #E2E8F0; --border-light: #F1F5F9;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.02);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.07);
      --shadow-lg: 0 8px 30px rgba(0,0,0,0.1);
      --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px;
      --transition: 200ms cubic-bezier(0.3,0,0.4,1);
      --transition-fast: 120ms cubic-bezier(0.3,0,0.4,1);
      --bounce: 400ms cubic-bezier(0.34,1.56,0.64,1);
      --sidebar-width: 200px; --nav-height: 56px;
      --topbar-bg: rgba(255,255,255,.8);
      --scrollbar-thumb: #CBD5E1; --scrollbar-thumb-hover: #94A3B8;
      --echarts-tooltip-bg: rgba(255,255,255,.96);
      --echarts-tooltip-border: #cbd5e1;
      --echarts-tooltip-text: #334155;
      --echarts-axis-label: #475569;
      --echarts-axis-line: #cbd5e1;
      --echarts-split-line: rgba(148,163,184,.35);
      --echarts-donut-center: #0f172a;
    }
    [data-theme="dark"] {
      --primary: #0EF; --primary-hover: #5cf; --primary-light: rgba(0,238,255,0.08);
      --primary-border: rgba(0,200,255,0.25); --primary-glow: rgba(0,238,255,0.25); --accent: #0EF;
      --text-primary: #e6f0ff; --text-secondary: #8ab4f8; --text-tertiary: #7f9bc0; --text-muted: #5f8bc9;
      --bg-body: radial-gradient(circle at 30% 10%, #0a1628, #020510);
      --bg-card: rgba(12,25,45,0.45); --bg-subtle: rgba(0,20,40,0.45);
      --border: rgba(0,180,255,0.35); --border-light: rgba(0,180,255,0.18);
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.4);
      --shadow-lg: 0 8px 32px rgba(0,0,0,0.5);
      --topbar-bg: rgba(8,18,36,0.75);
      --scrollbar-thumb: rgba(0,200,255,0.3); --scrollbar-thumb-hover: rgba(0,200,255,0.5);
      --echarts-tooltip-bg: rgba(8,18,36,.95);
      --echarts-tooltip-border: rgba(0,200,255,0.3);
      --echarts-tooltip-text: #d0e2ff;
      --echarts-axis-label: #8ab4f8;
      --echarts-axis-line: rgba(0,200,255,0.2);
      --echarts-split-line: rgba(0,200,255,0.08);
      --echarts-donut-center: #d0e2ff;
    }
    [data-theme="dark"] body{background:radial-gradient(circle at 30% 10%,#0a1628,#020510);font-size:15px;letter-spacing:0.03em}
    [data-theme="dark"] .sidebar{background:rgba(8,18,36,0.7);border-right-color:rgba(0,180,255,0.25);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
    [data-theme="dark"] .sidebar-logo{border-bottom-color:rgba(0,180,255,0.20)}
    [data-theme="dark"] .sidebar-nav a{color:#8ab4f8}
    [data-theme="dark"] .sidebar-nav a.active{background:rgba(0,238,255,0.08);color:#0ef;box-shadow:inset 3px 0 0 #0ef}
    [data-theme="dark"] .sidebar-nav a:hover{background:rgba(0,20,40,0.4);color:#e6f0ff}
    [data-theme="dark"] .sidebar-footer{border-top-color:rgba(0,180,255,0.20)}
    [data-theme="dark"] .sidebar-nav .nav-label{color:#5f8bc9;text-transform:uppercase;letter-spacing:1.5px}
    [data-theme="dark"] .topbar{background:rgba(8,18,36,0.65);border-bottom-color:rgba(0,180,255,0.25);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}

    [data-theme="dark"] .card{background:rgba(12,25,45,0.45);border-color:rgba(0,200,255,0.18);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:1.8rem}
    [data-theme="dark"] .card-hover:hover{border-color:rgba(0,238,255,0.5);box-shadow:0 8px 32px rgba(0,0,0,0.4),0 0 0 1px rgba(0,238,255,0.15),0 0 30px rgba(0,238,255,0.1)}
    [data-theme="dark"] .chart-card{background:rgba(12,25,45,0.4);border-color:rgba(0,200,255,0.18);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:2rem}
    [data-theme="dark"] .chart-card:hover{box-shadow:0 8px 32px rgba(0,0,0,0.4),0 0 0 1px rgba(0,238,255,0.15),0 0 30px rgba(0,238,255,0.08)}
    [data-theme="dark"] .chart-value{color:#e6f0ff;font-weight:600}
    [data-theme="dark"] .card-title{color:#e6f0ff;font-weight:500}
    [data-theme="dark"] .chart-title{color:#5f8bc9;text-transform:uppercase;letter-spacing:2px;font-size:0.85rem}
    [data-theme="dark"] .search-bar{background:rgba(0,20,40,0.6);border-color:rgba(0,200,255,0.2);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:60px}
    [data-theme="dark"] .search-bar:focus-within{border-color:#0ef;box-shadow:0 0 40px rgba(0,238,255,0.35)}
    [data-theme="dark"] .btn-primary{background:linear-gradient(145deg,#0a2444,#00142b);border:1px solid #00ccff;color:#0ef;box-shadow:0 0 15px rgba(0,238,255,0.25)}
    [data-theme="dark"] .btn-primary:hover{background:#003355;box-shadow:0 0 25px #0ef;color:#fff}
    [data-theme="dark"] .btn-secondary{background:rgba(0,20,40,0.5);color:#8ab4f8;border:1px solid rgba(0,200,255,0.15)}
    [data-theme="dark"] .btn-secondary:hover{background:rgba(0,238,255,0.08);color:#e6f0ff}
    [data-theme="dark"] .btn-ghost{color:#aed4ff !important}
    [data-theme="dark"] .btn-ghost:hover{background:rgba(0,238,255,0.08);color:#e6faff !important}
    [data-theme="dark"] .btn-danger{color:#ff6b6b !important}
    [data-theme="dark"] .btn-danger:hover{background:rgba(255,0,0,0.12) !important}
    [data-theme="dark"] .user-dropdown{background:rgba(8,18,36,0.88);border-color:rgba(0,200,255,0.2);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
    [data-theme="dark"] .user-dropdown button:hover{background:rgba(0,20,40,0.5);color:#0ef}
    [data-theme="dark"] .avatar-letter{background:rgba(0,238,255,0.1);color:#0ef}
    [data-theme="dark"] .user-avatar:hover{background:#0ef;color:#020510}
    [data-theme="dark"] #faq-search,[data-theme="dark"] .input,[data-theme="dark"] textarea.input{background:rgba(0,20,40,0.5);border-color:rgba(0,200,255,0.15);color:#e0f0ff}
    [data-theme="dark"] .input:focus{border-color:#0ef;box-shadow:0 0 0 3px rgba(0,238,255,0.2)}
    [data-theme="dark"] .modal{background:rgba(16,30,52,0.85);border:1px solid rgba(0,180,255,0.20)}
    [data-theme="dark"] .modal-title{color:#d8e8ff;font-weight:500}
    [data-theme="dark"] .modal .form-group label{color:#aac4ee}
    [data-theme="dark"] #upload-modal .form-group label{color:#b0d0f8 !important}
    [data-theme="dark"] #upload-modal .btn-outline{border-color:rgba(0,200,255,0.30);color:#b0d4ff}
    [data-theme="dark"] #upload-modal .btn-outline:hover{background:rgba(0,200,255,0.08);border-color:#0ef}
    [data-theme="dark"] #upload-modal input[type=file]::file-selector-button{background:rgba(0,180,255,0.10);color:#b0d4ff;border:1px solid rgba(0,200,255,0.25);border-radius:4px;padding:4px 10px;cursor:pointer}
    [data-theme="dark"] #upload-modal input[type=file]::file-selector-button:hover{background:rgba(0,180,255,0.18)}
    [data-theme="dark"] .modal-overlay{background:rgba(0,0,0,0.80)}
    [data-theme="dark"] .modal-card{background:rgba(14,28,48,0.92);border-color:rgba(0,180,255,0.28);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px)}
    [data-theme="dark"] .modal-header{border-bottom-color:rgba(0,180,255,0.20)}
    [data-theme="dark"] .modal-footer{border-top-color:rgba(0,180,255,0.20)}
    [data-theme="dark"] .preview-content{background:rgba(15,35,55,0.65);border-color:rgba(0,180,255,0.20);color:#d8e8ff}
    [data-theme="dark"] .preview-content table{border-color:rgba(0,200,255,0.12)}
    [data-theme="dark"] .preview-content th{background:rgba(0,20,40,0.5)}
    [data-theme="dark"] .preview-content tr:nth-child(even){background:rgba(0,20,40,0.15)}
    [data-theme="dark"] .preview-content tr:hover{background:rgba(0,238,255,0.04)}
    [data-theme="dark"] .preview-sidebar{background:rgba(15,35,55,0.7);border-color:rgba(0,180,255,0.18)}
    [data-theme="dark"] .preview-section-title{color:#8ab4f8;font-weight:500}
    [data-theme="dark"] .img-gallery-bg{background:rgba(0,0,0,0.85)}
    [data-theme="dark"] table.file-table th{background:rgba(0,20,40,0.5);color:#8ab4f8}
    [data-theme="dark"] table.file-table td{border-bottom-color:rgba(0,180,255,0.15)}
    [data-theme="dark"] table.file-table tr:hover td{background:rgba(0,238,255,0.04)}
    [data-theme="dark"] .breadcrumb-bar .crumb-sep{color:#5f8bc9}
    [data-theme="dark"] .pagination-btn{background:rgba(0,20,40,0.4);color:#8ab4f8;border-color:rgba(0,200,255,0.12)}
    [data-theme="dark"] .pagination-btn:hover{background:rgba(0,238,255,0.08);color:#0ef}
    [data-theme="dark"] .pagination-btn.active{background:rgba(0,238,255,0.1);color:#0ef;border-color:rgba(0,238,255,0.25)}
    [data-theme="dark"] .category-tag{background:rgba(0,238,255,0.08);color:#0ef}
    [data-theme="dark"] .category-card{background:rgba(15,28,48,0.45);border-color:rgba(0,200,255,0.18);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:1.5rem}
    [data-theme="dark"] .category-card:hover{border-color:#0ef;box-shadow:0 0 25px rgba(0,238,255,0.25);transform:translateY(-4px)}
    [data-theme="dark"] .category-card .cat-count{color:#3cc5ff}
    [data-theme="dark"] .tabs{border-bottom-color:rgba(0,180,255,0.22)}
    [data-theme="dark"] .tab{color:#7f9bc0}
    [data-theme="dark"] .tab:hover{color:#b0d4ff}
    [data-theme="dark"] .tab.active{color:#0ef;border-bottom-color:#0ef}
    [data-theme="dark"] .empty-state{color:#5f8bc9}
    [data-theme="dark"] .faq-answer{color:#c8d6e5;line-height:1.7}
    [data-theme="dark"] .faq-question{color:#0ef}
    [data-theme="dark"] .file-card{background:rgba(12,25,45,0.35);border-color:rgba(0,200,255,0.12);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:1.8rem}
    [data-theme="dark"] .file-card:hover{border-color:rgba(0,238,255,0.4);box-shadow:0 8px 32px rgba(0,0,0,0.35),0 0 0 1px rgba(0,238,255,0.1)}
    [data-theme="dark"] .file-row:hover{background:rgba(0,20,40,0.35)}
    [data-theme="dark"] .file-item .file-name{color:#e6f0ff}
    [data-theme="dark"] .file-item .file-meta{color:#7f9bc0}
    [data-theme="dark"] .site-footer{border-top-color:rgba(0,180,255,0.22);color:#6688aa}
    [data-theme="dark"] .toast{background:rgba(8,18,36,0.9);border-color:rgba(0,200,255,0.2);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);color:#e6f0ff}
    [data-theme="dark"] .toast-success{border-color:rgba(0,238,255,0.25)}
    [data-theme="dark"] .theme-toggle-btn{background:rgba(0,20,40,0.5);border:1px solid rgba(0,200,255,0.15);color:#7f9bc0}
    [data-theme="dark"] .theme-toggle-btn:hover{background:rgba(0,238,255,0.08);color:#0ef;border-color:rgba(0,238,255,0.3)}
    [data-theme="dark"] mark{background:rgba(0,238,255,0.18);color:#e6faff;border-bottom:1px solid rgba(0,238,255,0.45);font-weight:500}
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

    /* ─── Hero Section ─── */
    .hero-section{position:relative;background:var(--bg-card);border-radius:var(--radius-lg);padding:1.8rem 2rem;margin-bottom:1.5rem;overflow:hidden;min-height:120px;display:flex;flex-direction:column;justify-content:center;border:1px solid var(--border);box-shadow:var(--shadow-sm)}
    .hero-section .hero-content{position:relative;z-index:1;padding-left:1rem;border-left:3px solid var(--primary)}
    .hero-section .hero-title{font-size:1.4rem;font-weight:700;color:var(--text-primary);letter-spacing:0.3px;margin-bottom:0.15rem;line-height:1.3}
    .hero-section .hero-title span{color:var(--primary)}
    .hero-section .hero-subtitle{font-size:0.8rem;color:#2B3E5A;margin-bottom:0.9rem;letter-spacing:0.2px;font-weight:450}
    .hero-quick-search{position:relative;z-index:1;display:flex;gap:0.5rem;align-items:center}
    .hero-quick-search input{flex:1;padding:0.6rem 1rem 0.6rem 2.2rem;background:#fff;border:1px solid #d0d7e3;border-radius:2rem;color:#0B1628;font-size:0.9rem;font-family:inherit;outline:none;transition:all 0.25s}
    .hero-quick-search input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-glow);background:#fff}
    .hero-quick-search input::placeholder{color:#8896a8;font-size:0.8rem;font-weight:400}
    .hero-quick-search .search-icon{position:absolute;left:0.8rem;font-size:0.85rem;color:var(--text-tertiary);pointer-events:none}
    .hero-quick-search .hero-search-btn{padding:0.55rem 1.2rem;background:var(--primary);border:none;border-radius:2rem;color:#fff;font-size:0.8rem;font-weight:600;cursor:pointer;transition:all 0.2s;font-family:inherit;white-space:nowrap;box-shadow:0 2px 6px var(--primary-glow)}
    .hero-quick-search .hero-search-btn:hover{background:var(--primary-hover);box-shadow:0 3px 10px var(--primary-glow)}
    .hero-hot-tags{display:flex;gap:0.35rem;flex-wrap:wrap;margin-top:0.6rem;position:relative;z-index:1;align-items:center}
    .hero-hot-tags .hot-tag-label{font-size:0.68rem;color:var(--text-tertiary);margin-right:0.2rem}
    .hero-hot-tags .hot-tag{padding:0.1rem 0.5rem;font-size:0.68rem;border-radius:1rem;background:var(--bg-subtle);color:var(--text-tertiary);border:1px solid var(--border);cursor:pointer;transition:all 0.2s}
    .hero-hot-tags .hot-tag:hover{background:var(--primary-light);color:var(--primary);border-color:var(--primary-border)}
    /* ─── Dark mode hero ─── */
    [data-theme="dark"] .hero-section{background:rgba(12,25,45,0.45);border-color:rgba(0,180,255,0.18);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
    [data-theme="dark"] .hero-section .hero-content{border-left-color:var(--primary)}
    [data-theme="dark"] .hero-section .hero-title{color:var(--text-primary)}
    [data-theme="dark"] .hero-section .hero-title span{color:var(--primary)}
    [data-theme="dark"] .hero-section .hero-subtitle{color:#8ab4f8}
    [data-theme="dark"] .hero-quick-search input{background:rgba(0,25,55,0.6);border-color:rgba(0,200,255,0.25);color:#e6f0ff}
    [data-theme="dark"] .hero-quick-search input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-glow);background:rgba(0,35,70,0.7)}
    [data-theme="dark"] .hero-quick-search input::placeholder{color:#6090b0}
    [data-theme="dark"] .hero-quick-search .hero-search-btn{background:linear-gradient(145deg,#0a2444,#00142b);border:1px solid var(--primary-border);color:var(--primary);box-shadow:0 0 15px var(--primary-glow)}
    [data-theme="dark"] .hero-quick-search .hero-search-btn:hover{background:#003355;box-shadow:0 0 25px var(--primary);color:#fff}
    [data-theme="dark"] .hero-hot-tags .hot-tag-label{color:var(--text-muted)}
    [data-theme="dark"] .hero-hot-tags .hot-tag{background:rgba(0,180,255,0.08);color:var(--text-tertiary);border-color:rgba(0,180,255,0.15)}
    [data-theme="dark"] .hero-hot-tags .hot-tag:hover{background:rgba(0,238,255,0.15);color:var(--primary);border-color:rgba(0,238,255,0.3)}
    /* ─── End Hero ─── */

    /* ─── Main content fadeIn ─── */
    @keyframes pageFadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    #main-content{animation:pageFadeIn 0.35s ease}
    html{-webkit-font-smoothing:antialiased}
    html{font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei','Inter',system-ui,-apple-system,BlinkMacSystemFont,sans-serif}html,body{font-family:inherit;background:var(--bg-body);color:var(--text-primary);font-size:14px;line-height:1.5;min-height:100vh;width:100%;letter-spacing:0.02em;font-weight:400}
    a{color:var(--primary);text-decoration:none}button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:inherit;color:inherit}
    input,select,textarea{font-family:inherit;font-size:inherit}
    ::-webkit-scrollbar{width:5px;height:5px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:var(--scrollbar-thumb);border-radius:3px;transition:all var(--transition)}
    ::-webkit-scrollbar-thumb:hover{background:var(--scrollbar-thumb-hover);box-shadow:0 0 12px var(--primary-glow)}

    .app-layout{display:flex;min-height:100vh}
    .sidebar{position:fixed;top:0;left:0;width:var(--sidebar-width);height:100vh;background:var(--bg-card);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:30;overflow-y:auto}
    .sidebar-logo{display:flex;align-items:center;gap:8px;padding:14px 14px;border-bottom:1px solid var(--border-light);font-size:14px;font-weight:600;color:var(--text-primary);letter-spacing:-0.2px}
    .sidebar-logo .logo-icon{width:32px;height:32px;background:linear-gradient(135deg,#1e40af,#3b82f6);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;flex-shrink:0;box-shadow:0 2px 8px rgba(59,130,246,.4)}
    .sidebar-nav{padding:6px 10px;flex:1;overflow-y:auto}
    .sidebar-nav .nav-section{margin-bottom:12px}
    .sidebar-nav .nav-section:last-child{margin-bottom:0}
    .sidebar-nav .nav-label{font-size:11px;font-weight:600;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:1px;padding:0 12px 6px}
    .sidebar-nav a{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;color:var(--text-secondary);transition:all var(--transition);text-decoration:none}
    .sidebar-nav a:hover{background:var(--bg-subtle);color:var(--text-primary)}
    .sidebar-nav a.active{background:var(--primary-light);color:var(--primary);font-weight:600}
    .sidebar-nav a .nav-icon{width:18px;text-align:center;font-size:14px;flex-shrink:0}
    .sidebar-footer{padding:10px 14px;border-top:1px solid var(--border-light);display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .sidebar-footer .sidebar-version{font-size:11px;color:var(--text-tertiary);opacity:.6}
    .sidebar{transition:background 0.3s}
    .main-area{transition:margin-left 0.3s}
    .topbar .user-info{display:flex;align-items:center;gap:8px;margin-left:12px;position:relative}
    .topbar .user-avatar{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;cursor:pointer;transition:all var(--transition);overflow:hidden}
    .topbar .user-avatar.avatar-img{width:28px;height:28px;object-fit:cover;border-radius:50%}
    .topbar .user-avatar.avatar-letter{background:var(--primary-light);color:var(--primary)}
    .topbar .user-avatar:hover{color:#fff;transform:scale(1.05);background:var(--primary)}
    .topbar .user-info span{font-size:13px;font-weight:500;color:var(--text-secondary);max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
    .topbar .user-info .user-dropdown{position:absolute;top:calc(100% + 8px);right:0;min-width:140px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);box-shadow:var(--shadow-lg);padding:4px;z-index:50;display:none}
    .topbar .user-info .user-dropdown.show{display:block}

  _initLoginThree() {
    const el = document.getElementById('login-three-bg');
    if (!el || el.dataset.threeLoaded) return;
    el.dataset.threeLoaded = '1';
    import('three').then((THREE) => {
      const w = el.clientWidth, h = el.clientHeight;
      if (!w || !h) {
        el.dataset.threeLoaded = '';
        requestAnimationFrame(() => this._initLoginThree());
        return;
      }

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x03050b);

      const camera = new THREE.PerspectiveCamera(42, w / h, 0.1, 1000);
      camera.position.set(0, 0, 8);
      camera.lookAt(0, 0, 0);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(w, h);
      renderer.setClearColor(0x03050b, 1);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.6));
      el.innerHTML = '';
      el.appendChild(renderer.domElement);

      const group = new THREE.Group();

      const torusKnotGeo = new THREE.TorusKnotGeometry(1.05, 0.04, 180, 24, 3, 4);
      const knotMat = new THREE.MeshStandardMaterial({ color: 0x3e8eff, emissive: 0x1a66bb, emissiveIntensity: 0.6, transparent: true, opacity: 0.4 });
      const knot = new THREE.Mesh(torusKnotGeo, knotMat);
      group.add(knot);

      const boxGeo = new THREE.BoxGeometry(1.6, 1.6, 1.6);
      const edgesGeo = new THREE.EdgesGeometry(boxGeo);
      const boxWireMat = new THREE.LineBasicMaterial({ color: 0x5f9eff });
      const wireframeBox = new THREE.LineSegments(edgesGeo, boxWireMat);
      wireframeBox.position.set(0, 0, 0);
      group.add(wireframeBox);

      const ringGeo = new THREE.TorusGeometry(1.4, 0.028, 128, 200);
      const ringMat = new THREE.MeshStandardMaterial({ color: 0x88b4ff, emissive: 0x2277cc, emissiveIntensity: 0.5 });
      const ring = new THREE.Mesh(ringGeo, ringMat);
      group.add(ring);

      const smallRingGeo = new THREE.TorusGeometry(0.8, 0.018, 96, 160);
      const smallRing = new THREE.Mesh(smallRingGeo, ringMat);
      group.add(smallRing);

      scene.add(group);

      // 背景星空粒子 (700个)
      const starCount = 700;
      const starGeo = new THREE.BufferGeometry();
      const starPos = [];
      for (let i = 0; i < starCount; i++) {
        starPos.push((Math.random() - 0.5) * 30);
        starPos.push((Math.random() - 0.5) * 18);
        starPos.push((Math.random() - 0.5) * 16 - 12);
      }
      starGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(starPos), 3));
      const starMat = new THREE.PointsMaterial({ color: 0x8ab3ff, size: 0.055, transparent: true, opacity: 0.45, blending: THREE.AdditiveBlending });
      const starsField = new THREE.Points(starGeo, starMat);
      scene.add(starsField);

      // 飘浮微光粒子 (400个)
      const glowCount = 400;
      const glowGeo = new THREE.BufferGeometry();
      const glowPos = [];
      for (let i = 0; i < glowCount; i++) {
        glowPos.push((Math.random() - 0.5) * 7);
        glowPos.push((Math.random() - 0.5) * 5);
        glowPos.push((Math.random() - 0.5) * 6);
      }
      glowGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(glowPos), 3));
      const glowMat = new THREE.PointsMaterial({ color: 0x7aaaff, size: 0.04, transparent: true, blending: THREE.AdditiveBlending, opacity: 0.5 });
      const glowPoints = new THREE.Points(glowGeo, glowMat);
      scene.add(glowPoints);

      const ambient = new THREE.AmbientLight(0x111122);
      const light = new THREE.PointLight(0x5588ff, 0.55);
      light.position.set(1.5, 2, 2);
      const backLight = new THREE.PointLight(0x3377aa, 0.3);
      backLight.position.set(-1, 0.5, -2);
      scene.add(ambient);
      scene.add(light);
      scene.add(backLight);

      let time = 0;
      let animId;
      function animate() {
        animId = requestAnimationFrame(animate);
        time += 0.012;
        group.rotation.x = Math.sin(time * 0.2) * 0.2;
        group.rotation.y = time * 0.28;
        group.rotation.z = Math.cos(time * 0.18) * 0.15;
        ring.rotation.z = time * 0.45;
        ring.rotation.x = Math.sin(time * 0.3) * 0.2;
        smallRing.rotation.x = time * 0.55;
        smallRing.rotation.y = time * 0.35;
        starsField.rotation.y += 0.0006;
        starsField.rotation.x += 0.0003;
        glowPoints.rotation.y = time * 0.08;
        glowPoints.rotation.x = Math.sin(time * 0.15) * 0.1;
        renderer.render(scene, camera);
      }
      animate();

      const handleResize = () => {
        const nw = el.clientWidth, nh = el.clientHeight;
        if (nw && nh) { camera.aspect = nw / nh; camera.updateProjectionMatrix(); renderer.setSize(nw, nh); }
      };
      window.addEventListener('resize', handleResize);
      el._threeCleanup = () => { if (animId) cancelAnimationFrame(animId); window.removeEventListener('resize', handleResize); renderer.dispose(); };
    });
  },

  _bindUpload() {
    const btn = document.getElementById('upload-btn');
    if (!btn) return;
    btn.onclick = () => {
      const m = document.getElementById('upload-modal');
      if (!m) return;
      m.style.display = 'flex';
      m.classList.add('show');
    };
    document.getElementById('upload-cancel-btn').onclick = () => {
      const m = document.getElementById('upload-modal');
      m.classList.remove('show'); m.style.display = 'none';
    };

    // 冲突处理状态
    let _conflictQueue = [];
    let _conflictStrategy = 'overwrite'; // 批量时的统一策略

    // 冲突选择按钮事件
    document.querySelectorAll('[data-conflict]').forEach(el => {
      el.onclick = () => {
        const action = el.getAttribute('data-conflict');
        if (action === 'cancel-all') {
          _conflictQueue = [];
          document.getElementById('upload-conflict-zone').style.display = 'none';
          document.getElementById('upload-progress').textContent = '✗ 已取消';
          return;
        }
        _conflictStrategy = action === 'rename' ? 'rename' : (action === 'skip' ? 'skip' : 'overwrite');
        // 处理队列中的文件
        document.getElementById('upload-conflict-zone').style.display = 'none';
        _processConflictQueue();
      };
    });

    async function _processConflictQueue() {
      const batchProgress = document.getElementById('batch-progress');
      const batchResult = document.getElementById('batch-result');
      const p = document.getElementById('upload-progress');
      let success = 0, fail = 0;
      for (const file of _conflictQueue) {
        const fd = new FormData();
        fd.append('file', file);
        fd.append('conflict', _conflictStrategy);
        batchProgress.textContent = '上传中: ' + file.name;
        try {
          const r = await fetch('/api/upload', { method: 'POST', body: fd });
          const d = await r.json();
          if (d.success) {
            success++;
            const line = document.createElement('div');
            line.style.cssText = 'padding:2px 0;color:var(--text-secondary)';
            const label = d.skipped ? '⏭ ' : (d.renamed ? '↪ ' : '✓ ');
            line.textContent = label + (d.renamed ? d.filename + ' (原: ' + d.originalFilename + ')' : (d.filename || file.name)) + (d.skipped ? ' 已存在' : '');
            batchResult.appendChild(line);
          } else {
            fail++;
            const line = document.createElement('div');
            line.style.cssText = 'padding:2px 0;color:#EF4444';
            line.textContent = '✗ ' + file.name + ': ' + (d.error || '失败');
            batchResult.appendChild(line);
          }
        } catch {
          fail++;
          const line = document.createElement('div');
          line.style.cssText = 'padding:2px 0;color:#EF4444';
          line.textContent = '✗ ' + file.name + ': 网络错误';
          batchResult.appendChild(line);
        }
      }
      _conflictQueue = [];
      batchProgress.textContent = '完成! 成功 ' + success + ', 失败 ' + fail;
      App._refreshAfterUpload();
      App.toast('上传完成', fail > 0 ? 'warning' : 'success');
    }

    document.getElementById('upload-form').onsubmit = async (e) => {
      e.preventDefault();
      const input = e.target.querySelector('input[type=file]');
      const files = Array.from(input.files || []);
      if (!files.length) return;
      const p = document.getElementById('upload-progress');
      if (files.length === 1) {
        // 单个文件：先检查是否存在
        const checkRes = await fetch('/api/check-file-exists?name=' + encodeURIComponent(files[0].name));
        const check = await checkRes.json();
        if (check.exists) {
          // 弹出冲突选择
          const zone = document.getElementById('upload-conflict-zone');
          document.getElementById('upload-conflict-msg').textContent = '文件「' + files[0].name + '」已存在，请选择操作：';
          zone.style.display = 'block';
          _conflictQueue = [files[0]];
          _conflictStrategy = 'overwrite';
          return;
        }
        // 不存在，直接上传
        const fd = new FormData();
        fd.append('file', files[0]);
        p.textContent = '上传中...';
        try {
          const r = await fetch('/api/upload', { method: 'POST', body: fd });
          if (r.ok) {
            p.textContent = '✓ 上传成功';
            document.getElementById('upload-modal').classList.remove('show');
            document.getElementById('upload-modal').style.display = 'none';
            App._refreshAfterUpload();
            App.toast('上传成功', 'success');
          } else { const d = await r.json(); p.textContent = '失败: ' + (d.error || '未知错误'); }
        } catch { p.textContent = '网络错误'; }
      } else {
        // 多选文件，逐批上传（检查冲突）
        p.textContent = '';
        const batchProgress = document.getElementById('batch-progress');
        const batchResult = document.getElementById('batch-result');
        batchProgress.style.display = 'block';
        batchResult.style.display = 'block';
        batchResult.innerHTML = '';
        const total = files.length;

        // 先检查所有文件是否有冲突
        const checkPromises = files.map(f => fetch('/api/check-file-exists?name=' + encodeURIComponent(f.name)).then(r => r.json()).then(d => ({ file: f, exists: d.exists })));
        const checks = await Promise.all(checkPromises);
        const conflicted = checks.filter(c => c.exists).map(c => c.file);
        const noConflict = checks.filter(c => !c.exists).map(c => c.file);

        if (conflicted.length > 0) {
          // 有冲突：弹出选择框，放入队列
          const zone = document.getElementById('upload-conflict-zone');
          document.getElementById('upload-conflict-msg').textContent = conflicted.length + ' 个文件已存在（如「' + conflicted[0].name + '」等），请选择操作：';
          zone.style.display = 'block';
          _conflictQueue = conflicted;
          _conflictStrategy = 'overwrite';
          return;
        }

        // 无冲突，直接全部上传
        let success = 0, fail = 0;
        for (const file of noConflict) {
          batchProgress.textContent = '上传中: ' + file.name;
          const fd = new FormData();
          fd.append('file', file);
          try {
            const r = await fetch('/api/upload', { method: 'POST', body: fd });
            const d = await r.json();
            if (d.success) {
              success++;
              const line = document.createElement('div');
              line.style.cssText = 'padding:2px 0;color:var(--text-secondary)';
              line.textContent = '✓ ' + file.name;
              batchResult.appendChild(line);
            } else {
              fail++;
              const line = document.createElement('div');
              line.style.cssText = 'padding:2px 0;color:#EF4444';
              line.textContent = '✗ ' + file.name + ': ' + (d.error || '失败');
              batchResult.appendChild(line);
            }
          } catch {
            fail++;
            const line = document.createElement('div');
            line.style.cssText = 'padding:2px 0;color:#EF4444';
            line.textContent = '✗ ' + file.name + ': 网络错误';
            batchResult.appendChild(line);
          }
        }
        batchProgress.textContent = '完成! 成功 ' + success + ', 失败 ' + fail;
        App._refreshAfterUpload();
        input.value = '';
        document.getElementById('upload-modal').classList.remove('show');
        document.getElementById('upload-modal').style.display = 'none';
        App.toast('成功上传 ' + success + ' 个文件' + (fail > 0 ? '，' + fail + ' 个失败' : ''), fail > 0 ? 'warning' : 'success');
      }
    };

    // ── 批量上传目录 ──
    const dirInput = document.getElementById('batch-dir-input');
    const dirName = document.getElementById('batch-dir-name');
    const batchBtn = document.getElementById('batch-upload-btn');
    const batchProgress = document.getElementById('batch-progress');
    const batchResult = document.getElementById('batch-result');
    let selectedFiles = [];

    document.getElementById('batch-dir-btn').onclick = () => dirInput.click();

    dirInput.onchange = (e) => {
      selectedFiles = Array.from(e.target.files || []);
      if (selectedFiles.length === 0) {
        dirName.textContent = '未选择';
        batchBtn.disabled = true;
        return;
      }
      // 显示目录名（取第一个文件的webkitRelativePath的顶层目录）
      const topDir = selectedFiles[0].webkitRelativePath.split('/')[0];
      dirName.textContent = topDir + ' (' + selectedFiles.length + ' 个文件)';
      batchBtn.disabled = false;
    };

    batchBtn.onclick = async () => {
      if (selectedFiles.length === 0) return;
      batchBtn.disabled = true;
      batchProgress.style.display = 'block';
      batchResult.style.display = 'block';
      batchResult.innerHTML = '';

      const total = selectedFiles.length;

      // 预先检查所有冲突
      const checkPromises = selectedFiles.map(f => fetch('/api/check-file-exists?name=' + encodeURIComponent(f.name)).then(r => r.json()).then(d => ({ file: f, exists: d.exists })));
      const checks = await Promise.all(checkPromises);
      const conflicted = checks.filter(c => c.exists).map(c => c.file);
      const noConflict = checks.filter(c => !c.exists).map(c => c.file);

      if (conflicted.length > 0) {
        // 有冲突：弹冲突选择框
        const zone = document.getElementById('upload-conflict-zone');
        document.getElementById('upload-conflict-msg').textContent = conflicted.length + ' 个文件已存在（如「' + conflicted[0].name + '」等），请选择操作：';
        zone.style.display = 'block';
        _conflictQueue = conflicted;
        _conflictStrategy = 'overwrite';
        batchBtn.disabled = false;
        return;
      }

      // 无冲突时直接上传
      let success = 0, fail = 0;
      for (const file of noConflict) {
        batchProgress.textContent = '上传中: ' + file.name;
        const fd = new FormData();
        fd.append('file', file);
        try {
          const r = await fetch('/api/upload', { method: 'POST', body: fd });
          const d = await r.json();
          if (d.success) {
            success++;
            const line = document.createElement('div');
            line.style.cssText = 'padding:2px 0;color:var(--text-secondary)';
            line.textContent = '✓ ' + file.name;
            batchResult.appendChild(line);
          } else {
            fail++;
            const line = document.createElement('div');
            line.style.cssText = 'padding:2px 0;color:#EF4444';
            line.textContent = '✗ ' + file.name + ': ' + (d.error || '失败');
            batchResult.appendChild(line);
          }
        } catch (err) {
          fail++;
          const line = document.createElement('div');
          line.style.cssText = 'padding:2px 0;color:#EF4444';
          line.textContent = '✗ ' + file.name + ': 网络错误';
          batchResult.appendChild(line);
        }
      }

      batchProgress.textContent = '完成! 成功 ' + success + ', 失败 ' + fail;
      batchBtn.disabled = false;
      selectedFiles = [];
      dirName.textContent = '未选择';
      App._refreshAfterUpload();
      App.toast('成功上传 ' + success + ' 个文件' + (fail > 0 ? '，' + fail + ' 个失败' : ''), fail > 0 ? 'warning' : 'success');
    };
  },
  _openAvatarUpload() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/png,image/jpeg,image/gif,image/webp,image/svg+xml';
    input.onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (file.size > 2 * 1024 * 1024) { App.toast('图片不能超过 2MB', 'error'); return; }
      const fd = new FormData();
      fd.append('avatar', file);
      try {
        const r = await fetch('/api/auth/avatar', { method: 'POST', body: fd });
        const d = await r.json();
        if (d.success) {
          App.user.avatar = d.avatar;
          App.toast('头像已更新', 'success');
          // 重新渲染顶栏
          const hash = location.hash.slice(1) || '/';
          App.renderLayout(document.getElementById('app'), hash);
        } else {
          App.toast(d.error || '上传失败', 'error');
        }
      } catch {
        App.toast('网络错误', 'error');
      }
    };
    input.click();
  },

  // ─── Category Cards ───
  async renderCategoryCards() {
    this._activeCategoryView = null;
    const ca = document.getElementById('content-area');
    if (!ca) return;
    try {
      const r = await fetch('/api/files');
      const d = await r.json();
      const all = d.files || d || [];
      const cats = ['方案','报告','密评FAQ','标准规范','法规政策','参考文档','其他','全部'];
      const st = {};
      for (const c of cats) st[c] = { count: 0, recent: [], formats: new Set() };
      const imgExts = new Set(['PNG','JPG','JPEG','GIF','WEBP','SVG']);
      const _mapCat = (f) => {
        const raw = f.category || '其他';
        const m = raw.match(/^(.+)\/_images$/);
        if (m) return m[1];
        if (raw === '根目录') return '其他';
        return raw;
      };
      const nonImgFiles = all.filter(f => { const ext = (f.original_ext || f.name || '').split('.').pop().toUpperCase(); return !imgExts.has(ext); });
      for (const f of nonImgFiles) { const c = _mapCat(f); if (!st[c]) st[c] = { count: 0, recent: [], formats: new Set() }; st[c].count++; if (st[c].recent.length < 3) st[c].recent.push(f.original_name); if (f.original_ext) st[c].formats.add(f.original_ext); }
      st['全部'].count = nonImgFiles.length;
      st['全部'].recent = nonImgFiles.slice(0, 3).map(f => f.original_name);
      nonImgFiles.forEach(f => { if (f.original_ext) st['全部'].formats.add(f.original_ext); });

      const _fmtSort = (a,b) => { const o=['PDF','DOCX','XLSX','PPTX','DOC','XLS','PPT','MD','TXT','CSV','HTML']; return (o.indexOf(a)===-1?99:o.indexOf(a))-(o.indexOf(b)===-1?99:o.indexOf(b)); };
      let cards = '';
      for (const c of cats) {
        const s = st[c];
        const icon = this._catIcons[c] || I.folder;
        const fmtStr = s.formats.size > 0 ? ' · ' + [...s.formats].sort(_fmtSort).join('/') : '';
        const recentHtml = s.recent.length > 0
          ? s.recent.map(n => '<div class="truncate">' + this.esc(n) + '</div>').join('')
          : '<div style="font-style:italic">暂无文档</div>';
        cards +=
          '<div class="category-card" data-cat="' + c + '">' +
            '<div class="flex justify-between"><span class="cat-icon">' + icon + '</span><span class="badge">' + s.count + ' 个文档</span></div>' +
            '<div class="cat-name">' + c + '</div>' +
            '<div class="cat-recent">' + recentHtml + '</div>' +
            '<div class="cat-cta">浏览 ' + I.arrowRight + '</div>' +
          '</div>';
      }
      ca.innerHTML = '<div class="category-grid">' + cards + '</div>';
      ca.querySelectorAll('.category-card').forEach(el => { el.onclick = () => this.openCategory(el.dataset.cat); });
      setTimeout(() => this.animateStaggered(ca, '.category-card', 50), 50);
      // 统计区和页脚
      this.renderStatsFooter(all, cats);
    } catch { ca.innerHTML = '<div class="empty-state"><div class="empty-icon">' + I.alertTriangle + '</div><div class="empty-text">加载分类失败</div></div>'; }
  },

  // ─── Theme Toggle ───
  _initTheme() {
    const saved = localStorage.getItem('kb-theme');
    if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    else document.documentElement.removeAttribute('data-theme');
    const btn = document.getElementById('theme-toggle-btn');
    if (!btn) return;
    btn.textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙';
    btn.onclick = () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      if (isDark) {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('kb-theme', 'light');
        btn.textContent = '🌙';
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('kb-theme', 'dark');
        btn.textContent = '☀️';
      }
      // ECharts 重绘
      this._rethemeECharts();
    };
