<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>密码应用知识库</title>
  <style>
    :root {
      --primary: #2563EB; --primary-hover: #1D4ED8; --primary-light: #EFF6FF;
      --primary-border: #BFDBFE; --accent: #2563EB;
      --text-primary: #1E293B; --text-secondary: #64748B; --text-tertiary: #94A3B8;
      --bg-body: #F8FAFC; --bg-card: #FFFFFF; --bg-subtle: #F1F5F9;
      --border: #E2E8F0; --border-light: #F1F5F9;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.05);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.08);
      --radius-sm: 6px; --radius-md: 10px; --radius-lg: 14px;
      --transition: 200ms cubic-bezier(0.3,0,0.4,1);
      --transition-fast: 120ms cubic-bezier(0.3,0,0.4,1);
      --bounce: 400ms cubic-bezier(0.34,1.56,0.64,1);
      --sidebar-width: 220px; --nav-height: 52px;
    }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    html{-webkit-font-smoothing:antialiased}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg-body);color:var(--text-primary);font-size:14px;line-height:1.5;min-height:100vh}
    a{color:var(--primary);text-decoration:none}button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:inherit;color:inherit}
    input,select,textarea{font-family:inherit;font-size:inherit}
    ::-webkit-scrollbar{width:5px;height:5px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:3px;transition:all var(--transition)}
    ::-webkit-scrollbar-thumb:hover{background:#94A3B8;box-shadow:0 0 8px rgba(37,99,235,.3)}

    .app-layout{display:flex;min-height:100vh}
    .sidebar{position:fixed;top:0;left:0;width:var(--sidebar-width);height:100vh;background:var(--bg-card);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:30;overflow-y:auto}
    .sidebar-logo{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--border-light);font-size:15px;font-weight:600;color:var(--text-primary);letter-spacing:-0.2px}
    .sidebar-logo .logo-icon{width:28px;height:28px;background:var(--primary);border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;flex-shrink:0}
    .sidebar-nav{flex:1;padding:12px 10px}
    .sidebar-nav .nav-section{margin-bottom:16px}
    .sidebar-nav .nav-label{font-size:11px;font-weight:600;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.8px;padding:0 10px 6px}
    .sidebar-nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;color:var(--text-secondary);transition:all var(--transition);text-decoration:none}
    .sidebar-nav a:hover{background:var(--bg-subtle);color:var(--text-primary)}
    .sidebar-nav a.active{background:var(--primary-light);color:var(--primary);font-weight:600}
    .sidebar-nav a .nav-icon{width:18px;text-align:center;font-size:14px;flex-shrink:0}
    .sidebar-footer{padding:12px 16px;border-top:1px solid var(--border-light);display:flex;align-items:center;justify-content:space-between}
    .sidebar-footer .user-info{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-secondary)}
    .sidebar-footer .user-avatar{width:24px;height:24px;border-radius:6px;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
    .sidebar-footer .logout-btn{font-size:11px;color:var(--text-tertiary);padding:4px 8px;border-radius:4px;transition:all var(--transition)}
    .sidebar-footer .logout-btn:hover{color:#EF4444;background:#FEF2F2}
    .main-area{margin-left:var(--sidebar-width);flex:1;min-height:100vh}
    .topbar{position:sticky;top:0;z-index:20;height:var(--nav-height);background:rgba(255,255,255,.8);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 28px}
    .topbar-title{font-size:14px;font-weight:500;color:var(--text-primary)}
    .topbar-actions{display:flex;align-items:center;gap:8px}
    .main-content{padding:28px;max-width:1200px}

    .btn{display:inline-flex;align-items:center;gap:6px;padding:7px 16px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;transition:all var(--transition);white-space:nowrap;position:relative;overflow:hidden;cursor:pointer}
    .btn-primary{background:var(--primary);color:#fff}
    .btn:active{transform:scale(.97)}
    .btn-primary:hover{background:var(--primary-hover)}
    .btn-secondary{background:var(--bg-subtle);color:var(--text-secondary)}
    .btn-secondary:hover{background:var(--border);color:var(--text-primary)}
    .btn-ghost{color:var(--text-secondary)}
    .btn-ghost:hover{background:var(--bg-subtle);color:var(--text-primary)}
    .btn-danger{color:#EF4444}.btn-danger:hover{background:#FEF2F2}
    .btn-sm{padding:4px 10px;font-size:12px;border-radius:4px}

    .card{background:var(--bg-card);border-radius:var(--radius-md);border:1px solid var(--border);box-shadow:var(--shadow-sm);transition:all var(--transition)}
    .card-hover:hover{box-shadow:var(--shadow-md);border-color:var(--primary-border);transform:translateY(-1px)}
    .search-bar{display:flex;gap:8px;align-items:center;background:var(--bg-card);border-radius:var(--radius-md);border:1px solid var(--border);padding:4px 4px 4px 16px;box-shadow:var(--shadow-sm);transition:all var(--transition)}
    .search-bar:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
    .search-bar input{flex:1;border:none;outline:none;background:transparent;font-size:14px;color:var(--text-primary);padding:8px 0}
    .search-bar input::placeholder{color:var(--text-tertiary)}
    .search-bar select{border:none;outline:none;background:var(--bg-subtle);padding:6px 10px;border-radius:var(--radius-sm);font-size:12px;color:var(--text-secondary)}
    .search-stats{font-size:12px;color:var(--text-tertiary);margin-top:6px;padding-left:4px}
    .category-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
    .category-card{background:var(--bg-card);border-radius:var(--radius-md);border:1px solid var(--border);padding:20px;cursor:pointer;transition:all var(--transition)}
    .category-card:active{transform:scale(.97)}
    .category-card:hover{box-shadow:var(--shadow-md),0 0 0 1px var(--primary-border);border-color:var(--primary-border);transform:translateY(-2px)}
    .category-card:hover .cat-icon{transform:scale(1.15)}
    .category-card .cat-icon{font-size:28px;display:inline-block;transition:transform var(--bounce)}
    .category-card .cat-name{font-size:15px;font-weight:600;margin-top:12px;color:var(--text-primary)}
    .category-card .cat-count{font-size:12px;color:var(--text-tertiary);margin-top:2px}
    .category-card .cat-recent{margin-top:10px}
    .category-card .cat-recent div{font-size:12px;color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .category-card .cat-cta{margin-top:12px;font-size:12px;color:var(--primary);font-weight:500}
    .file-card{background:var(--bg-card);border-radius:var(--radius-md);border:1px solid var(--border);padding:16px;transition:all var(--transition)}
    .file-card:active{transform:scale(.97)}
    .file-card:hover{box-shadow:var(--shadow-md),0 0 0 1px var(--primary-border)}
    .file-card:hover .file-icon{transform:scale(1.15)}
    .file-card .file-icon{font-size:24px;display:inline-block;transition:transform var(--bounce)}
    .file-card .file-name{font-size:13px;font-weight:600;color:var(--text-primary);margin-top:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .file-card .file-meta{font-size:11px;color:var(--text-tertiary);margin-top:6px;display:flex;gap:8px;flex-wrap:wrap}
    .file-card .file-actions{margin-top:12px;padding-top:10px;border-top:1px solid var(--border-light);display:flex;gap:6px}
    .file-row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:var(--radius-sm);transition:background var(--transition)}
    .file-row:hover{background:var(--bg-body)}
    .file-row .file-icon{font-size:18px;flex-shrink:0}
    .file-row .file-info{flex:1;min-width:0}
    .file-row .file-info .name{font-size:13px;font-weight:500;color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .file-row .file-info .meta{font-size:11px;color:var(--text-tertiary);margin-top:2px;display:flex;gap:6px}
    .file-row .file-actions{flex-shrink:0;display:flex;gap:4px}
    .badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:3px;font-size:11px;font-weight:500;background:var(--bg-subtle);color:var(--text-secondary);transition:all var(--transition)}
    .badge-primary{background:var(--primary-light);color:var(--primary)}
    .badge-admin{background:#F3E8FF;color:#7C3AED}
    .badge-engineer{background:var(--primary-light);color:var(--primary)}
    .tabs{display:flex;border-bottom:1px solid var(--border)}
    .tab{padding:8px 16px;font-size:13px;font-weight:500;color:var(--text-tertiary);border-bottom:2px solid transparent;transition:all var(--transition);cursor:pointer}
    .tab:active{transform:scale(.97)}
    .tab:hover{color:var(--text-secondary)}.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
    .table-wrap{background:var(--bg-card);border-radius:var(--radius-md);border:1px solid var(--border);overflow:hidden}
    table{width:100%;border-collapse:collapse;font-size:13px}
    th{text-align:left;padding:10px 14px;font-weight:600;color:var(--text-secondary);background:var(--bg-subtle);border-bottom:1px solid var(--border);font-size:12px}
    td{padding:10px 14px;border-bottom:1px solid var(--border-light);color:var(--text-primary)}
    tr:last-child td{border-bottom:none}tr:hover td{background:var(--bg-body)}tr td{transition:background var(--transition)}
    .form-group{margin-bottom:14px}
    .form-group label{display:block;font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:4px}
    .input{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-card);color:var(--text-primary);transition:all var(--transition);outline:none}
    .input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
    .modal-overlay{position:fixed;inset:0;background:rgba(15,23,42,.35);display:flex;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(2px);opacity:0;transition:opacity var(--transition)}
    .modal-overlay.show{opacity:1}
    .modal{background:var(--bg-card);border-radius:var(--radius-lg);padding:24px;max-width:480px;width:90%;max-height:80vh;overflow-y:auto;box-shadow:var(--shadow-lg);transform:scale(.96);opacity:0;transition:all .2s cubic-bezier(0.34,1.56,0.64,1)}
    .modal-overlay.show .modal{transform:scale(1);opacity:1}
    .modal-title{font-size:16px;font-weight:600;margin-bottom:16px;color:var(--text-primary)}
    .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
    .faq-item{border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;background:var(--bg-card)}
    .faq-q{padding:14px 16px;font-size:13px;font-weight:500;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;transition:all var(--transition)}
    .faq-q:active{transform:scale(.98)}
    .faq-q:hover{background:var(--bg-body)}
    .faq-arrow{font-size:10px;color:var(--text-tertiary);transition:transform .2s}
    .faq-q.open .faq-arrow{transform:rotate(180deg)}
    .faq-a{display:none;padding:0 16px 14px;font-size:13px;color:var(--text-secondary);line-height:1.7}
    .faq-a.open{display:block}
    .snippet{font-size:12px;color:var(--text-secondary);line-height:1.5}
    mark{background:#FEF08A;color:inherit;padding:0 2px;border-radius:2px}
    .login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg-body);padding:24px}
    .login-card{background:var(--bg-card);border-radius:var(--radius-lg);border:1px solid var(--border);box-shadow:var(--shadow-lg);padding:40px;width:100%;max-width:380px;transition:box-shadow var(--transition),transform var(--transition)}
    .login-card:hover{box-shadow:var(--shadow-lg),0 0 0 1px var(--primary-border);transform:translateY(-1px)}
    .login-card h1{font-size:20px;font-weight:700;color:var(--text-primary);letter-spacing:-0.3px}
    .login-card p{font-size:13px;color:var(--text-secondary);margin-top:4px;margin-bottom:24px}
    .login-card .logo-icon{width:36px;height:36px;background:var(--primary);border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;margin-bottom:16px}
    .login-error{font-size:12px;color:#EF4444;margin-top:8px;display:none}
    .load-more-btn{display:block;width:100%;padding:10px;text-align:center;font-size:13px;color:var(--text-tertiary);background:var(--bg-subtle);border-radius:var(--radius-sm);transition:all var(--transition)}
    .load-more-btn:active{transform:scale(.98)}
    .load-more-btn:hover{color:var(--text-secondary);background:var(--border)}
    .search-result-item{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px 16px;transition:all var(--transition)}
    .search-result-item:active{transform:scale(.99)}
    .search-result-item:hover{box-shadow:var(--shadow-md)}
    .search-result-item .sr-title{font-size:13px;font-weight:600;color:var(--text-primary)}
    .search-result-item .sr-meta{font-size:11px;color:var(--text-tertiary);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap}
    .search-result-item .sr-snippet{margin-top:6px}
    .preview-content{font-size:13px;line-height:1.7;color:var(--text-primary);white-space:pre-wrap}
    .empty-state{text-align:center;padding:48px 0;color:var(--text-tertiary)}
    .empty-state .empty-icon{font-size:40px;margin-bottom:12px}
    .empty-state .empty-text{font-size:14px}
    .view-toggle{display:flex;gap:2px;background:var(--bg-subtle);border-radius:var(--radius-sm);padding:2px}
    .view-toggle button{padding:4px 8px;font-size:13px;border-radius:4px;color:var(--text-tertiary);transition:all var(--transition)}
    .view-toggle button.active{background:var(--bg-card);color:var(--text-primary);box-shadow:var(--shadow-sm)}
    .flex{display:flex}.flex-1{flex:1}.flex-shrink-0{flex-shrink:0}
    .gap-1{gap:4px}.gap-2{gap:8px}.gap-3{gap:12px}
    .items-center{align-items:center}.items-start{align-items:flex-start}
    .justify-between{justify-content:space-between}
    .mb-2{margin-bottom:8px}.mb-3{margin-bottom:12px}.mb-4{margin-bottom:16px}
    .mt-2{margin-top:8px}
    .min-w-0{min-width:0}
    .p-3{padding:12px}
    .truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .file-info .name{font-size:13px;font-weight:500;color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .file-info .meta{font-size:11px;color:var(--text-tertiary);margin-top:2px;display:flex;gap:6px}
    .anim-stag{opacity:0;transform:translateY(10px)}
    .anim-stag.show{opacity:1;transform:translateY(0);transition:all .35s cubic-bezier(0.3,0,0.4,1)}
    .suggestions-wrap{position:relative}
    .suggestions-dropdown{position:absolute;top:100%;left:0;right:0;margin-top:4px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-lg);z-index:50;overflow:hidden;opacity:0;transform:translateY(-4px);transition:all var(--transition);pointer-events:none}
    .suggestions-dropdown.show{opacity:1;transform:translateY(0);pointer-events:auto}
    .suggestions-dropdown .sug-item{padding:10px 14px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:background var(--transition);border-bottom:1px solid var(--border-light)}
    .suggestions-dropdown .sug-item:last-child{border-bottom:none}
    .suggestions-dropdown .sug-item:hover,.suggestions-dropdown .sug-item.active{background:var(--primary-light)}
    .suggestions-dropdown .sug-item .sug-icon{font-size:14px;flex-shrink:0}
    .suggestions-dropdown .sug-item .sug-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .suggestions-dropdown .sug-item .sug-cat{font-size:10px}
    .ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.35);pointer-events:none;animation:rippleAnim .6s ease-out forwards}
    @keyframes rippleAnim{0%{transform:scale(0);opacity:1}100%{transform:scale(4);opacity:0}}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes scaleIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
  </style>
</head>
<body>
<div id="app"><div class="login-page"><div style="color:var(--text-tertiary);font-size:14px">加载中...</div></div></div>



<script>
const App = {
  user: null, _viewMode: 'card', _page: 1, _pageSize: 20,
  _allFiles: [], _lastQuery: '', _lastCategory: '', _activeCategoryView: null,
  _catIcons: {'全部':'📚','方案':'📋','报告':'📊','密评FAQ':'❓','标准规范':'📐','法规政策':'⚖️','参考文档':'📚','其他':'📁'},

  async init() {
    await this.checkAuth(); this.render();
    window.addEventListener('hashchange', () => this.render());
  },

  async checkAuth() {
    try { const r = await fetch('/api/auth/me'); const d = await r.json(); this.user = d.user; }
    catch { this.user = null; }
  },

  getHash() { return window.location.hash.slice(1) || '/'; },
  navigate(h) { window.location.hash = h; },

  render() {
    const h = this.getHash(), a = document.getElementById('app');
    if (!this.user) { this.renderLogin(a); return; }
    this.renderLayout(a, h);
  },

  logout() {
    fetch('/api/auth/logout', { method: 'POST' }).then(() => { this.user = null; this.navigate('/login'); });
  },

  // ─── Login ───
  renderLogin(c) {
    c.innerHTML =
      '<div class="login-page">' +
        '<div class="login-card">' +
          '<div class="logo-icon">🔐</div>' +
          '<h1>密码应用知识库</h1>' +
          '<p>请登录以继续使用</p>' +
          '<form id="login-form">' +
            '<div class="form-group"><label>用户名</label><input name="username" class="input" required autocomplete="username"></div>' +
            '<div class="form-group"><label>密码</label><input type="password" name="password" class="input" required autocomplete="current-password"></div>' +
            '<div class="login-error" id="login-error"></div>' +
            '<button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:8px">登录</button>' +
          '</form>' +
        '</div>' +
      '</div>';
    document.getElementById('login-form').onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const err = document.getElementById('login-error');
      err.style.display = 'none';
      try {
        const r = await fetch('/api/auth/login', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: fd.get('username'), password: fd.get('password') })
        });
        if (r.ok) { await this.checkAuth(); this.navigate('/'); }
        else { const d = await r.json(); err.textContent = d.error || '登录失败'; err.style.display = 'block'; }
      } catch { err.textContent = '网络错误'; err.style.display = 'block'; }
    };
  },

  // ─── Layout ───
  renderLayout(container, hash) {
    const isAdmin = this.user.role === 'admin';
    const activeCls = (p) => hash === p ? 'active' : '';
    container.innerHTML =
      '<div class="app-layout">' +
        '<aside class="sidebar">' +
          '<div class="sidebar-logo"><div class="logo-icon">🔐</div><span>密码应用知识库</span></div>' +
          '<nav class="sidebar-nav">' +
            '<div class="nav-section"><div class="nav-label">导航</div>' +
              '<a href="#/" class="' + activeCls('/') + '"><span class="nav-icon">📂</span>文档浏览</a>' +
              '<a href="#/faq" class="' + activeCls('/faq') + '"><span class="nav-icon">❓</span>密评 FAQ</a>' +
            '</div>' +
            (isAdmin
              ? '<div class="nav-section"><div class="nav-label">管理</div>' +
                '<a href="#/admin/users" class="' + activeCls('/admin/users') + '"><span class="nav-icon">👥</span>用户管理</a>' +
                '<a href="#/admin/logs" class="' + activeCls('/admin/logs') + '"><span class="nav-icon">📋</span>操作日志</a>' +
                '<a href="#/admin/faq" class="' + activeCls('/admin/faq') + '"><span class="nav-icon">✏️</span>FAQ 管理</a>' +
              '</div>'
              : '') +
          '</nav>' +
          '<div class="sidebar-footer">' +
            '<div class="user-info"><div class="user-avatar">' + (this.user.username || 'U')[0].toUpperCase() + '</div><span>' + this.esc(this.user.username) + '</span></div>' +
            '<button class="logout-btn" onclick="App.logout()">退出</button>' +
          '</div>' +
        '</aside>' +
        '<div class="main-area">' +
          '<header class="topbar"><div class="topbar-title" id="topbar-title">文档浏览</div><div class="topbar-actions"></div></header>' +
          '<main class="main-content" id="main-content"></main>' +
        '</div>' +
      '</div>';
    this.renderPage(hash);
  },

  async renderPage(hash) {
    const main = document.getElementById('main-content');
    if (!main) return;
    if (hash === '/faq') return this.renderFaq(main);
    if (hash.startsWith('/admin/users')) return this.renderAdminUsers(main);
    if (hash.startsWith('/admin/logs')) return this.renderAdminLogs(main);
    if (hash.startsWith('/admin/faq')) return this.renderAdminFaq(main);
    this.renderHome(main);
  },

          const r = await fetch('/api/upload', { method: 'POST', body: fd });

  // ─── Category Cards ───
  async renderCategoryCards() {
    this._activeCategoryView = null;
    const ca = document.getElementById('content-area');
    if (!ca) return;
    try {
      const r = await fetch('/api/files');
      const d = await r.json();
      const all = d.files || d || [];
      const cats = ['全部','方案','报告','密评FAQ','标准规范','法规政策','参考文档','其他'];
      const st = {};
      for (const c of cats) st[c] = { count: 0, recent: [] };
      for (const f of all) { const c = f.category || '根目录'; if (!st[c]) st[c] = { count: 0, recent: [] }; st[c].count++; if (st[c].recent.length < 3) st[c].recent.push(f.original_name); }
      st['全部'].count = all.length;
      st['全部'].recent = all.slice(0, 3).map(f => f.original_name);

      let cards = '';
      for (const c of cats) {
        const s = st[c];
        const icon = this._catIcons[c] || '📁';
        const recentHtml = s.recent.length > 0
          ? s.recent.map(n => '<div class="truncate">' + this.esc(n) + '</div>').join('')
          : '<div style="font-style:italic">暂无文档</div>';
        cards +=
          '<div class="category-card" data-cat="' + c + '">' +
            '<div class="flex justify-between"><span class="cat-icon">' + icon + '</span><span class="badge">' + s.count + ' 个文档</span></div>' +
            '<div class="cat-name">' + c + '</div>' +
            '<div class="cat-recent">' + recentHtml + '</div>' +
            '<div class="cat-cta">浏览 →</div>' +
          '</div>';
      }
      ca.innerHTML = '<div class="category-grid">' + cards + '</div>';
      ca.querySelectorAll('.category-card').forEach(el => { el.onclick = () => this.openCategory(el.dataset.cat); });
      setTimeout(() => this.animateStaggered(ca, '.category-card', 50), 50);
    } catch { ca.innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-text">加载分类失败</div></div>'; }
  },

  // ─── Open Category ───
  async openCategory(category) {
    this._activeCategoryView = category;
    const ca = document.getElementById('content-area');
    const icon = this._catIcons[category] || '📁';
    const allCats = ['全部','方案','报告','密评FAQ','标准规范','法规政策','参考文档','其他'];
    const tabsHtml = allCats.map(c => '<button class="tab' + (c === category ? ' active' : '') + '" data-cat="' + c + '">' + c + '</button>').join('');
    ca.innerHTML =
      '<div class="mb-4">' +
        '<button class="btn btn-ghost btn-sm mb-2" id="back-btn" style="padding-left:0">← 返回分类</button>' +
        '<div style="font-size:15px;font-weight:600"><span class="cat-icon" style="font-size:20px">' + icon + '</span> ' + category + '</div>' +
      '</div>' +
      '<div class="flex justify-between items-center mb-3">' +
        '<div class="tabs">' + tabsHtml + '</div>' +
        '<div class="view-toggle">' +
          '<button class="view-mode' + (this._viewMode === 'card' ? ' active' : '') + '" data-mode="card">⊞</button>' +
          '<button class="view-mode' + (this._viewMode === 'list' ? ' active' : '') + '" data-mode="list">☰</button>' +
        '</div>' +
      '</div>' +
      '<div id="file-list"></div>';

    document.getElementById('back-btn').onclick = () => { this._activeCategoryView = null; this.renderCategoryCards(); };
    document.querySelectorAll('.tabs .tab').forEach(b => { b.onclick = () => this.openCategory(b.dataset.cat); });
    document.querySelectorAll('.view-mode').forEach(b => {
      b.onclick = () => {
        this._viewMode = b.dataset.mode;
        document.querySelectorAll('.view-mode').forEach(x => x.classList.toggle('active', x.dataset.mode === this._viewMode));
        if (this._allFiles) this.renderFilePage();
      };
    });

    const catParam = category === '全部' ? '' : category;
    try {
      const r = await fetch('/api/files' + (catParam ? '?category=' + encodeURIComponent(catParam) : ''));
      const d = await r.json();
      this.renderFileList(d.files || d);
    } catch { document.getElementById('file-list').innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-text">加载失败</div></div>'; }
  },

  // ─── Render File List ───
  renderFileList(files) {
    const el = document.getElementById('file-list');
    if (!files.length) { el.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-text">暂无文档</div></div>'; return; }
    document.getElementById('search-stats').textContent = '共 ' + files.length + ' 个文件';
    this._allFiles = files; this._page = 1;
    this.renderFilePage();
    setTimeout(() => this.animateStaggered(document.getElementById('file-list'), '.file-card,.file-row', 50), 100);
  },

  renderFilePage() {
    const el = document.getElementById('file-list');
    if (!el) return;
    const files = this._allFiles || [];
    const ps = this._pageSize || 20;
    const pg = this._page || 1;
    const total = files.length, tp = Math.ceil(total / ps), start = (pg - 1) * ps;
    const pfiles = files.slice(start, start + ps);
    const isCard = this._viewMode === 'card';
    const isAdmin = this.user.role === 'admin';

    el.className = isCard ? 'category-grid' : '';

    let html = '';
    for (const f of pfiles) {
      const ext = f.original_ext || (f.original_name || '').split('.').pop().toUpperCase();
      const icons = { PDF:'📄', DOCX:'📝', DOC:'📝', XLSX:'📊', XLS:'📊', PPTX:'📽️', PPT:'📽️', MD:'📝', TXT:'📄', PNG:'🖼️', JPG:'🖼️', JPEG:'🖼️' };
      const icon = icons[ext] || '📎';
      const sz = f.file_size ? this.fmtSize(f.file_size) : '';
      const date = f.created_at ? f.created_at.slice(0, 10) : '';

      if (isCard) {
        html +=
          '<div class="file-card">' +
            '<div class="file-icon">' + icon + '</div>' +
            '<div class="file-name" title="' + this.esc(f.original_name) + '">' + this.esc(f.original_name) + '</div>' +
            '<div class="file-meta"><span class="badge">' + (f.category || '') + '</span><span>' + date + '</span>' + (sz ? '<span>' + sz + '</span>' : '') + '</div>' +
            '<div class="file-actions">' +
              (f.downloadPath ? '<a href="' + f.downloadPath + '" class="btn btn-ghost btn-sm" download>📥 下载</a>' : '') +
              (isAdmin ? '<button class="btn btn-danger btn-sm del-file" data-path="' + this.esc(f.path) + '" data-name="' + this.esc(f.original_name) + '">🗑️</button>' : '') +
            '</div>' +
          '</div>';
      } else {
        html +=
          '<div class="file-row">' +
            '<span class="file-icon">' + icon + '</span>' +
            '<div class="file-info">' +
              '<div class="name" title="' + this.esc(f.original_name) + '">' + this.esc(f.original_name) + '</div>' +
              '<div class="meta"><span class="badge">' + (f.category || '') + '</span><span>' + date + '</span>' + (sz ? '<span>' + sz + '</span>' : '') + '</div>' +
            '</div>' +
            '<div class="file-actions">' +
              (f.downloadPath ? '<a href="' + f.downloadPath + '" class="btn btn-ghost btn-sm" download>📥</a>' : '') +
              (isAdmin ? '<button class="btn btn-danger btn-sm del-file" data-path="' + this.esc(f.path) + '" data-name="' + this.esc(f.original_name) + '">🗑️</button>' : '') +
            '</div>' +
          '</div>';
      }
    }

    el.innerHTML = html;

    // Pagination
    if (tp > 1 && pg < tp) {
      const more = document.createElement('div');
      more.style.cssText = 'grid-column:1/-1;text-align:center;padding-top:8px';
      more.innerHTML = '<button class="load-more-btn" id="load-more">加载更多 (' + pg + '/' + tp + ')</button>';
      el.appendChild(more);
      document.getElementById('load-more').onclick = () => { this._page++; this.renderFilePage(); };
    }

    if (isAdmin) {
      el.querySelectorAll('.del-file').forEach(btn => {
        btn.onclick = async () => {
          if (!confirm('确认删除"' + btn.dataset.name + '"？')) return;
          try {
            const r = await fetch('/api/delete', { method: 'DELETE', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: btn.dataset.path }) });
            if (r.ok) { if (this._activeCategoryView) this.openCategory(this._activeCategoryView); else this.renderCategoryCards(); }
            else { const d = await r.json(); alert('删除失败: ' + (d.error || '')); }
          } catch { alert('网络错误'); }
        };
      });
    }
  },

  // ─── Animations ───
  animateStaggered(container, selector, delayMs) {
    const items = container.querySelectorAll(selector);
    if (!items.length) return;
    items.forEach((el, i) => {
      el.classList.add("anim-stag");
      setTimeout(() => el.classList.add("show"), i * delayMs);
    });
  },

  // ─── Ripple ───
  setupRipple() {
    document.querySelectorAll(".btn").forEach(btn => {
      btn.addEventListener("click", function(e) {
        const rect = this.getBoundingClientRect();
        const r = document.createElement("span");
        r.className = "ripple";
        const size = Math.max(rect.width, rect.height) * 2;
        r.style.width = r.style.height = size + "px";
        r.style.left = (e.clientX - rect.left - size / 2) + "px";
        r.style.top = (e.clientY - rect.top - size / 2) + "px";
        this.appendChild(r);
        setTimeout(() => r.remove(), 600);
      });
    });
  },

  // ─── Search Suggestions ───
  _sugTimeout: null, _sugIndex: -1, _sugItems: null,
  setupSuggestions() {
    const input = document.getElementById("search-input");
    if (!input) return;
    input.addEventListener("input", () => {
      clearTimeout(this._sugTimeout);
      const q = input.value.trim();
      if (q.length < 1) { this._hideSuggestions(); return; }
      this._sugTimeout = setTimeout(() => this._fetchSuggestions(q), 300);
    });
    input.addEventListener("keydown", (e) => {
      if (e.key === "ArrowDown") { e.preventDefault(); this._sugNavigate(1); }
      else if (e.key === "ArrowUp") { e.preventDefault(); this._sugNavigate(-1); }
      else if (e.key === "Enter") { this._sugConfirm(); }
      else if (e.key === "Escape") { this._hideSuggestions(); }
    });
    document.addEventListener("click", (e) => {
      const wrap = document.getElementById("suggestions-wrap");
      if (wrap && !wrap.contains(e.target)) setTimeout(() => this._hideSuggestions(), 200);
    });
  },
  async _fetchSuggestions(q) {
    try {
      const r = await fetch("/api/search?q=" + encodeURIComponent(q));
      const d = await r.json();
      const results = Array.isArray(d) ? d : (d.results || []);
      const titles = results.filter(x => x.original_name).slice(0, 5);
      this._showSuggestions(titles, q);
    } catch {}
  },
  _showSuggestions(items, query) {
    const existing = document.getElementById("suggestions-dropdown");
    if (existing) existing.remove();
    if (!items.length) return;
    this._sugItems = items;
    this._sugIndex = -1;
    const wrap = document.getElementById("suggestions-wrap");
    if (!wrap) return;
    const dd = document.createElement("div");
    dd.id = "suggestions-dropdown";
    dd.className = "suggestions-dropdown show";
    dd.innerHTML = items.map((f, i) =>
      "<div class=\"sug-item\" data-idx=\"" + i + "\">" +
        "<span class=\"sug-icon\">📄</span>" +
        "<span class=\"sug-name\">" + this.esc(f.original_name) + "</span>" +
        (f.category ? "<span class=\"badge sug-cat\">" + this.esc(f.category) + "</span>" : "") +
      "</div>"
    ).join("");
    dd.addEventListener("click", (e) => {
      const item = e.target.closest(".sug-item");
      if (item) {
        const idx = parseInt(item.dataset.idx);
        const f = this._sugItems[idx];
        if (f) { document.getElementById("search-input").value = f.original_name; this._hideSuggestions(); this.doSearch(); }
      }
    });
    wrap.appendChild(dd);
  },
  _hideSuggestions() {
    const dd = document.getElementById("suggestions-dropdown");
    if (dd) { dd.classList.remove("show"); setTimeout(() => dd.remove(), 200); }
    this._sugItems = null; this._sugIndex = -1;
  },
  _sugNavigate(dir) {
    const items = this._sugItems;
    if (!items || !items.length) return;
    this._sugIndex = Math.max(-1, Math.min(items.length - 1, this._sugIndex + dir));
    document.querySelectorAll(".sug-item").forEach((el, i) => el.classList.toggle("active", i === this._sugIndex));
  },
  _sugConfirm() {
    const items = this._sugItems;
    if (!items || this._sugIndex < 0 || !items[this._sugIndex]) return;
    const f = items[this._sugIndex];
    document.getElementById("search-input").value = f.original_name;
    this._hideSuggestions();
    this.doSearch();
  },

  // ─── Search ───
  async doSearch() {
    const q = document.getElementById('search-input').value.trim();
    const cat = document.getElementById('search-category').value;
    if (!q) { this._activeCategoryView = null; this.renderCategoryCards(); document.getElementById('search-stats').textContent = ''; return; }
    this._lastQuery = q; this._lastCategory = cat; this._activeCategoryView = null;
    try {
      const r = await fetch('/api/search?q=' + encodeURIComponent(q) + (cat ? '&category=' + encodeURIComponent(cat) : ''));
      const d = await r.json();
      const results = Array.isArray(d) ? d : (d.results || []);
      const cnt = typeof d.count === 'number' ? d.count : results.length;
      const ca = document.getElementById('content-area');
      ca.innerHTML =
        '<div class="mb-3"><div style="font-size:15px;font-weight:600"><span style="font-size:20px">🔍</span> 搜索结果</div></div>' +
        '<div id="search-results-list"></div>';
      document.getElementById('search-stats').textContent = '搜索 "' + q + '" — 找到 ' + cnt + ' 条结果';
      const el = document.getElementById('search-results-list');
      if (!results.length) { el.innerHTML = '<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-text">未找到相关内容</div></div>'; return; }
      const kws = this._extractKeywords(q);
      let html = '';
      for (const r of results) {
        const title = this.esc(r.original_name || r.title || r.name || '');
        const hlTitle = this._highlight(title, kws);
        const hlSnippet = this._highlight(this.esc(r.snippet || ''), kws);
        const mdPath = r.path || '';
        html +=
          '<div class="search-result-item mb-2">' +
            '<div class="sr-title">' + hlTitle + '</div>' +
            '<div class="sr-meta"><span class="badge badge-primary">' + this.esc(r.category || '') + '</span><span>' + (r.created_at ? r.created_at.slice(0,10) : '') + '</span>' +
              (r.score ? '<span style="color:var(--' + (r.method === '语义检索' ? 'primary' : 'tertiary') + ')">' + this.esc(r.method || '搜索') + '</span>' : '') +
            '</div>' +
            '<div class="sr-snippet snippet">' + hlSnippet + '</div>' +
            '<div class="mt-2 flex gap-2">' +
              (r.originalDownloadPath ? '<a href="' + r.originalDownloadPath + '" class="btn btn-ghost btn-sm" download>📥 下载原始文件</a>' : '') +
              (mdPath ? '<button class="btn btn-ghost btn-sm preview-btn" onclick="App.preview(\'' + encodeURIComponent(mdPath) + '\',\'' + this.escJS(title) + '\')">📄 预览文档</button>' : '') +
            '</div>' +
          '</div>';
      }
      el.innerHTML = html;
    } catch { document.getElementById('search-stats').textContent = '搜索失败，请重试'; }
  },

  _extractKeywords(q) {
    let w = q.split(/[\s,，、;；：]+/).filter(x => x.length >= 2);
    if (!w.length) {
      const ch = q.replace(/[^\u4e00-\u9fff\da-zA-Z]/g, '');
      if (ch.length >= 4) { w = []; for (const l of [4,3,2]) for (let i=0;i<=ch.length-l;i++) w.push(ch.substring(i,i+l)); }
      else if (ch.length >= 2) w = [ch];
      else w = [q];
    }
    w.sort((a,b) => b.length - a.length);
    return w;
  },

  _highlight(text, kws) {
    if (!text || !kws || !kws.length) return text || '';
    let r = text;
    for (const kw of kws) {
      if (kw.length < 2) continue;
      try { const re = new RegExp('(' + kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi'); r = r.replace(re, '<mark>$1</mark>'); } catch {}
    }
    return r;
  },

  // ─── Preview ───
  async preview(mdPath, title) {
    try {
      const r = await fetch('/api/preview?path=' + mdPath);
      if (!r.ok) { alert('无法加载文档'); return; }
      const d = await r.json();
      if (!d.success) { alert('无法加载文档'); return; }
      const modal = document.createElement('div');
      modal.className = 'modal-overlay';
      modal.onclick = function(e) { if (e.target === this) this.remove(); };
      modal.innerHTML =
        '<div class="modal" style="max-width:800px">' +
          '<div class="flex justify-between items-center mb-3">' +
            '<div class="modal-title truncate" style="margin-bottom:0">' + this.esc(title) + '</div>' +
            '<button class="btn btn-ghost btn-sm" onclick="this.closest(\'.modal-overlay\').remove()">✕</button>' +
          '</div>' +
          '<div class="preview-content">' + this.esc(d.content) + '</div>' +
        '</div>';
      document.body.appendChild(modal);
    } catch { alert('预览加载失败'); }
  },

  // ─── Admin: Users ───

              '<button type="submit" class="btn btn-primary btn-sm">添加</button>' +
            '</div>' +
          '</form>' +
        '</div>' +
      '</div>';

    this.loadUsers();
    document.getElementById('add-user-btn').onclick = () => { document.getElementById('add-user-modal').style.display = 'flex'; };
    document.getElementById('add-user-form').onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const err = document.getElementById('add-user-err');
      err.style.display = 'none';
      const r = await fetch('/api/admin/users', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: fd.get('username'), password: fd.get('password'), role: fd.get('role') }) });
      if (r.ok) { document.getElementById('add-user-modal').style.display = 'none'; e.target.reset(); this.loadUsers(); }
      else { const d = await r.json(); err.textContent = d.error || '创建失败'; err.style.display = 'block'; }
    };
  },

  async loadUsers() {
    try {
      const r = await fetch('/api/admin/users');
      const users = await r.json();
      const tb = document.getElementById('user-tbody');
      if (!tb) return;
      tb.innerHTML = users.map(u =>
        '<tr>' +
          '<td>' + this.esc(u.username) + '</td>' +
          '<td><span class="badge ' + (u.role === 'admin' ? 'badge-admin' : 'badge-engineer') + '">' + (u.role === 'admin' ? '管理员' : '工程师') + '</span></td>' +
          '<td style="color:var(--text-secondary)">' + (u.created_at ? u.created_at.slice(0,10) : '') + '</td>' +
          '<td>' + (u.id !== this.user.id ? '<button class="btn btn-danger btn-sm del-user" data-id="' + u.id + '" data-name="' + this.esc(u.username) + '">删除</button>' : '<span style="font-size:12px;color:var(--text-tertiary)">当前用户</span>') + '</td>' +
        '</tr>'
      ).join('');
      tb.querySelectorAll('.del-user').forEach(btn => {
        btn.onclick = async () => {
          if (!confirm('确认删除用户"' + btn.dataset.name + '"？')) return;
          const r = await fetch('/api/admin/users/' + btn.dataset.id, { method: 'DELETE' });
          if (r.ok) this.loadUsers(); else alert('删除失败');
        };
      });
    } catch {
      const tb = document.getElementById('user-tbody');
      if (tb) tb.innerHTML = '<tr><td colspan="4" style="color:#EF4444;text-align:center;padding:16px">加载失败</td></tr>';
    }
  },

  // ─── Admin: Logs ───
  async renderAdminLogs(container) {
    document.getElementById('topbar-title').textContent = '操作日志';
    document.querySelector('.topbar-actions').innerHTML = '';
    container.innerHTML =
      '<div style="font-size:16px;font-weight:600;margin-bottom:16px">操作日志</div>' +
      '<div class="flex gap-2 items-center mb-4">' +
        '<span style="font-size:13px;color:var(--text-secondary)">显示最近</span>' +
        '<select id="log-days" class="input" style="width:auto;padding:4px 10px;font-size:12px">' +
          '<option value="7">7天</option><option value="30" selected>30天</option><option value="90">90天</option><option value="180">180天</option>' +
        '</select>' +
        '<button class="btn btn-secondary btn-sm" id="log-refresh">刷新</button>' +
        '<span id="log-total" style="font-size:12px;color:var(--text-tertiary)"></span>' +
      '</div>' +
      '<div class="table-wrap"><table><thead><tr><th>时间</th><th>操作人</th><th>操作</th><th>详情</th></tr></thead><tbody id="log-tbody"></tbody></table></div>';

    const load = async () => {
      const days = document.getElementById('log-days').value;
      try {
        const r = await fetch('/api/admin/logs?days=' + days + '&limit=200');
        const d = await r.json();
        document.getElementById('log-total').textContent = '共 ' + d.total + ' 条';
        const tb = document.getElementById('log-tbody');
        if (!d.logs || !d.logs.length) { tb.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:16px;color:var(--text-tertiary)">暂无日志</td></tr>'; return; }
        tb.innerHTML = d.logs.map(l =>
          '<tr>' +
            '<td style="color:var(--text-secondary);white-space:nowrap">' + this.esc(l.created_at) + '</td>' +
            '<td>' + this.esc(l.username || '系统') + '</td>' +
            '<td><span class="badge">' + this.esc(l.action_label || l.action) + '</span></td>' +
            '<td style="color:var(--text-secondary)">' + this.esc(l.detail || '') + '</td>' +
          '</tr>'
        ).join('');
      } catch { document.getElementById('log-tbody').innerHTML = '<tr><td colspan="4" style="color:#EF4444;text-align:center;padding:16px">加载失败</td></tr>'; }
    };
    await load();
    document.getElementById('log-refresh').onclick = load;
    document.getElementById('log-days').onchange = load;
  },

  // ─── FAQ ───
  async renderFaq(container) {
    document.getElementById('topbar-title').textContent = '密评 FAQ';
    document.querySelector('.topbar-actions').innerHTML = '';
    container.innerHTML =
      '<div style="font-size:16px;font-weight:600;margin-bottom:12px">密评 FAQ</div>' +
      '<div class="mb-4"><input id="faq-search" class="input" placeholder="搜索 FAQ..." style="max-width:400px"></div>' +
      '<div id="faq-list"></div>';

    const load = async (q) => {
      try {
        const url = q ? '/api/faq?q=' + encodeURIComponent(q) : '/api/faq';
        const r = await fetch(url);
        const items = await r.json();
        const el = document.getElementById('faq-list');
        if (!items || !items.length) { el.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-text">暂无 FAQ 条目</div></div>'; return; }
        el.innerHTML = items.map(f =>
          '<div class="faq-item mb-2">' +
            '<div class="faq-q" data-id="' + f.id + '"><span>' + this.esc(f.question) + '</span><span class="faq-arrow">▼</span></div>' +
            '<div class="faq-a">' + this.esc(f.answer) + '</div>' +
          '</div>'
        ).join('');

        el.querySelectorAll('.faq-q').forEach(q => {
          q.onclick = () => {
            const a = q.nextElementSibling;
            a.classList.toggle('open');
            q.classList.toggle('open');
            q.querySelector('.faq-arrow').textContent = a.classList.contains('open') ? '▲' : '▼';
          };
        });
      } catch { document.getElementById('faq-list').innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-text">加载失败</div></div>'; }
    };
    await load('');
    document.getElementById('faq-search').onkeydown = (e) => { if (e.key === 'Enter') load(e.target.value.trim()); };
  },

  // ─── Admin: FAQ ───
  async renderAdminFaq(container) {
    document.getElementById('topbar-title').textContent = 'FAQ 管理';
    document.querySelector('.topbar-actions').innerHTML = '';
    container.innerHTML =
      '<div class="flex justify-between items-center mb-4">' +
        '<div style="font-size:16px;font-weight:600">FAQ 管理</div>' +
        '<button class="btn btn-primary btn-sm" id="add-faq-btn">+ 添加 FAQ</button>' +
      '</div>' +
      '<div id="admin-faq-list"></div>' +
      '<div id="faq-modal" class="modal-overlay" style="display:none">' +
        '<div class="modal">' +
          '<div class="modal-title" id="faq-modal-title">添加 FAQ</div>' +
          '<form id="faq-form">' +
            '<input type="hidden" name="id" value="">' +
            '<div class="form-group"><label>问题</label><input name="question" class="input" required></div>' +
            '<div class="form-group"><label>答案</label><textarea name="answer" rows="4" class="input" required></textarea></div>' +
            '<div class="form-group"><label>分类标签（可选）</label><input name="category" class="input"></div>' +
            '<div class="modal-actions">' +
              '<button type="button" class="btn btn-ghost btn-sm" onclick="this.closest(\'.modal-overlay\').style.display=\'none\'">取消</button>' +
              '<button type="submit" class="btn btn-primary btn-sm">保存</button>' +
            '</div>' +
          '</form>' +
        '</div>' +
      '</div>';

    const load = async () => {
      try {
        const r = await fetch('/api/faq');
        const items = await r.json();
        const el = document.getElementById('admin-faq-list');
        if (!items || !items.length) { el.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-text">暂无 FAQ 条目</div></div>'; return; }
        el.innerHTML = items.map(f =>
          '<div class="card p-3 mb-2 flex gap-3 items-start">' +
            '<div class="flex-1 min-w-0">' +
              '<div style="font-size:13px;font-weight:600">' + this.esc(f.question) + '</div>' +
              '<div style="font-size:12px;color:var(--text-secondary);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + this.esc(f.answer) + '</div>' +
            '</div>' +
            '<div class="flex gap-1 flex-shrink-0">' +
              '<button class="btn btn-ghost btn-sm edit-faq" data-item="' + this.escJS(JSON.stringify(f)) + '">编辑</button>' +
              '<button class="btn btn-danger btn-sm del-faq" data-id="' + f.id + '">删除</button>' +
            '</div>' +
          '</div>'
        ).join('');
        el.querySelectorAll('.edit-faq').forEach(btn => {
          btn.onclick = () => {
            const f = JSON.parse(btn.dataset.item);
            const form = document.getElementById('faq-form');
            form.elements.id.value = f.id;
            form.elements.question.value = f.question;
            form.elements.answer.value = f.answer;
            form.elements.category.value = f.category || '';
            document.getElementById('faq-modal-title').textContent = '编辑 FAQ';
            document.getElementById('faq-modal').style.display = 'flex';
          };
        });
        el.querySelectorAll('.del-faq').forEach(btn => {
          btn.onclick = async () => {
            if (!confirm('确认删除此 FAQ？')) return;
            const r = await fetch('/api/faq/' + btn.dataset.id, { method: 'DELETE' });
            if (r.ok) load();
          };
        });
      } catch { document.getElementById('admin-faq-list').innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-text">加载失败</div></div>'; }
    };

    await load();
    document.getElementById('add-faq-btn').onclick = () => {
      document.getElementById('faq-form').reset();
      document.getElementById('faq-form').elements.id.value = '';
      document.getElementById('faq-modal-title').textContent = '添加 FAQ';
      document.getElementById('faq-modal').style.display = 'flex';
    };
    document.getElementById('faq-form').onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const id = fd.get('id');
      const payload = { question: fd.get('question'), answer: fd.get('answer'), category: fd.get('category') };
      const method = id ? 'PUT' : 'POST';
      const url = id ? '/api/faq/' + id : '/api/faq';
      const r = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      if (r.ok) { document.getElementById('faq-modal').style.display = 'none'; load(); }
      else alert('保存失败');
    };
  },

  // ─── Utilities ───
  esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; },
  escJS(s) { if (!s) return ''; return s.replace(/'/g, '\\x27').replace(/"/g, '&quot;'); },
  fmtSize(b) { if (!b) return ''; if (b < 1024) return b + ' B'; if (b < 1048576) return (b/1024).toFixed(1) + ' KB'; return (b/1048576).toFixed(1) + ' MB'; }
};

App.init();
</script>
</body>
</html>
